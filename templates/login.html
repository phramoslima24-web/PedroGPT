<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - PedroGPT</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;

    background:
        radial-gradient(circle at top, #1e1b4b, transparent 45%),
        linear-gradient(135deg, #070711, #11111f, #09090f);

    color: white;
    padding: 20px;
}

.card {
    width: 100%;
    max-width: 390px;

    padding: 38px;

    border-radius: 24px;

    background: rgba(255,255,255,0.06);

    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);

    border: 1px solid rgba(255,255,255,0.10);

    box-shadow:
        0 25px 80px rgba(0,0,0,0.55);

    text-align: center;

    animation: aparecer .4s ease;
}

.logo {
    width: 70px;
    height: 70px;

    margin: 0 auto 18px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 20px;

    background:
        linear-gradient(135deg, #7c3aed, #4f46e5);

    font-size: 34px;

    box-shadow:
        0 10px 30px rgba(124,58,237,.35);
}

h1 {
    font-size: 27px;
    margin-bottom: 7px;
}

.subtitulo {
    color: rgba(255,255,255,.55);
    font-size: 14px;
    margin-bottom: 28px;
}

.campo {
    position: relative;
    margin-top: 13px;
}

input {
    width: 100%;

    padding: 15px 16px;

    border: 1px solid rgba(255,255,255,.10);

    border-radius: 13px;

    outline: none;

    background: rgba(255,255,255,.07);

    color: white;

    font-size: 14px;

    transition: .2s;
}

input:focus {
    border-color: #7c3aed;

    background: rgba(255,255,255,.09);

    box-shadow:
        0 0 0 3px rgba(124,58,237,.12);
}

input::placeholder {
    color: rgba(255,255,255,.45);
}

.senha-input {
    padding-right: 48px;
}

.olho {
    position: absolute;

    right: 15px;
    top: 50%;

    transform: translateY(-50%);

    cursor: pointer;

    opacity: .65;

    font-size: 17px;

    user-select: none;

    transition: .2s;
}

.olho:hover {
    opacity: 1;
}

button {
    width: 100%;

    padding: 15px;

    margin-top: 20px;

    border: none;

    border-radius: 13px;

    background:
        linear-gradient(
            135deg,
            #7c3aed,
            #4f46e5
        );

    color: white;

    font-size: 15px;

    font-weight: bold;

    cursor: pointer;

    transition: .2s;

    box-shadow:
        0 10px 25px rgba(79,70,229,.25);
}

button:hover {
    transform: translateY(-2px);

    box-shadow:
        0 14px 30px rgba(79,70,229,.35);
}

button:active {
    transform: scale(.98);
}

button:disabled {
    opacity: .6;
    cursor: not-allowed;
    transform: none;
}

.mensagem {
    min-height: 20px;

    margin-top: 15px;

    font-size: 13px;

    color: #fca5a5;
}

.link {
    display: block;

    margin-top: 22px;

    color: #c4b5fd;

    text-decoration: none;

    font-size: 14px;

    transition: .2s;
}

.link:hover {
    color: white;
}

.carregando {
    display: inline-flex;

    align-items: center;

    gap: 8px;
}

.spinner {
    width: 15px;
    height: 15px;

    border: 2px solid rgba(255,255,255,.35);
    border-top-color: white;

    border-radius: 50%;

    animation: girar .7s linear infinite;
}

@keyframes girar {
    to {
        transform: rotate(360deg);
    }
}

@keyframes aparecer {
    from {
        opacity: 0;
        transform: translateY(15px) scale(.98);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

@media(max-width: 450px) {

    .card {
        padding: 30px 22px;
        border-radius: 20px;
    }

    h1 {
        font-size: 24px;
    }

}

</style>
</head>

<body>

<div class="card">

    <div class="logo">
        🤖
    </div>

    <h1>Bem-vindo ao PedroGPT</h1>

    <div class="subtitulo">
        Entre na sua conta para continuar
    </div>


    <div class="campo">

        <input
            type="text"
            id="username"
            placeholder="Usuário"
            autocomplete="username"
        >

    </div>


    <div class="campo">

        <input
            type="password"
            id="password"
            class="senha-input"
            placeholder="Senha"
            autocomplete="current-password"
        >

        <span
            class="olho"
            id="olho"
            onclick="alternarSenha()"
        >
            👁️
        </span>

    </div>


    <button
        id="botaoLogin"
        onclick="login()"
    >
        Entrar
    </button>


    <div
        id="mensagem"
        class="mensagem"
    ></div>


    <a
        href="/register"
        class="link"
    >
        Ainda não tenho uma conta
    </a>

</div>


<script>

function alternarSenha() {

    const senha =
        document.getElementById("password");

    const olho =
        document.getElementById("olho");

    if (senha.type === "password") {

        senha.type = "text";

        olho.textContent = "🙈";

    } else {

        senha.type = "password";

        olho.textContent = "👁️";

    }
}


function mostrarMensagem(texto) {

    document.getElementById("mensagem").textContent =
        texto;

}


async function login() {

    const username =
        document.getElementById("username")
        .value
        .trim();

    const password =
        document.getElementById("password")
        .value;

    const botao =
        document.getElementById("botaoLogin");


    if (!username || !password) {

        mostrarMensagem(
            "Preencha usuário e senha."
        );

        return;
    }


    botao.disabled = true;

    botao.innerHTML = `
        <span class="carregando">
            <span class="spinner"></span>
            Entrando...
        </span>
    `;

    mostrarMensagem("");


    try {

        const resposta =
            await fetch(
                "/api/login",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            username,
                            password
                        })
                }
            );


        const data =
            await resposta.json();


        if (data.success) {

            window.location.href = "/";

            return;
        }


        mostrarMensagem(
            data.message ||
            "Usuário ou senha incorretos."
        );


    } catch (erro) {

        console.error(
            "Erro no login:",
            erro
        );

        mostrarMensagem(
            "Erro de conexão com o servidor."
        );

    }


    botao.disabled = false;

    botao.textContent = "Entrar";
}


document
    .getElementById("password")
    .addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                event.preventDefault();

                login();

            }

        }
    );


document
    .getElementById("username")
    .addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                event.preventDefault();

                login();

            }

        }
    );

</script>

</body>
</html>
