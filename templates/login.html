<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - PedroGPT</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f172a,#1e1b4b,#111827);
    color:#fff;
}

.card{
    width:380px;
    padding:35px;
    border-radius:22px;
    background:rgba(255,255,255,.06);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,.1);
    box-shadow:0 20px 50px rgba(0,0,0,.45);
}

.logo{
    text-align:center;
    margin-bottom:25px;
}

.logo h1{
    font-size:30px;
}

.logo p{
    color:#cbd5e1;
    margin-top:6px;
    font-size:14px;
}

.input-group{
    margin-bottom:16px;
}

.input-group label{
    display:block;
    margin-bottom:6px;
    font-size:14px;
    color:#ddd;
}

.input-group input{
    width:100%;
    padding:13px;
    border:none;
    border-radius:12px;
    outline:none;
    background:rgba(255,255,255,.1);
    color:white;
    border:1px solid transparent;
}

.input-group input:focus{
    border-color:#7c3aed;
}

.password-box{
    position:relative;
}

.password-box button{
    position:absolute;
    right:12px;
    top:50%;
    transform:translateY(-50%);
    background:none;
    border:none;
    color:#ddd;
    cursor:pointer;
    font-size:18px;
}

.login-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:linear-gradient(90deg,#7c3aed,#4f46e5);
    color:white;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

.login-btn:hover{
    transform:translateY(-2px);
}

.login-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.msg{
    margin-top:15px;
    text-align:center;
    font-size:14px;
    min-height:20px;
}

.error{ color:#f87171; }
.success{ color:#4ade80; }

.footer{
    text-align:center;
    margin-top:18px;
    font-size:14px;
}

.footer a{
    color:#a78bfa;
    text-decoration:none;
}
</style>
</head>
<body>

<div class="card">

    <div class="logo">
        <h1>🤖 PedroGPT</h1>
        <p>Entre na sua conta</p>
    </div>

    <div class="input-group">
        <label>Usuário</label>
        <input id="username" placeholder="Digite seu usuário">
    </div>

    <div class="input-group">
        <label>Senha</label>

        <div class="password-box">
            <input type="password" id="password" placeholder="Digite sua senha">
            <button type="button" onclick="toggleSenha()" id="eye">👁️</button>
        </div>
    </div>

    <button class="login-btn" onclick="login()" id="btnLogin">
        Entrar
    </button>

    <div id="msg" class="msg"></div>

    <div class="footer">
        Não possui conta?<br>
        <a href="/register">Criar conta</a>
    </div>

</div>

<script>

function mostrarMensagem(texto,tipo="error"){
    const msg=document.getElementById("msg");
    msg.className=`msg ${tipo}`;
    msg.textContent=texto;
}

function toggleSenha(){
    const senha=document.getElementById("password");
    const eye=document.getElementById("eye");

    if(senha.type==="password"){
        senha.type="text";
        eye.textContent="🙈";
    }else{
        senha.type="password";
        eye.textContent="👁️";
    }
}

async function login(){

    const username=document.getElementById("username").value.trim();
    const password=document.getElementById("password").value.trim();

    if(!username || !password){
        mostrarMensagem("Preencha usuário e senha.");
        return;
    }

    const btn=document.getElementById("btnLogin");

    btn.disabled=true;
    btn.textContent="Entrando...";

    mostrarMensagem("");

    try{

        const res=await fetch("/api/login",{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                username,
                password
            })
        });

        const data=await res.json();

        if(data.success){

            mostrarMensagem("Login realizado com sucesso!","success");

            setTimeout(()=>{
                window.location.href="/";
            },600);

        }else{

            mostrarMensagem(data.message || "Usuário ou senha incorretos.");

        }

    }catch(e){

        mostrarMensagem("Erro ao conectar ao servidor.");

    }

    btn.disabled=false;
    btn.textContent="Entrar";
}

document.getElementById("password").addEventListener("keydown",e=>{
    if(e.key==="Enter") login();
});

document.getElementById("username").addEventListener("keydown",e=>{
    if(e.key==="Enter") login();
});

</script>

</body>
</html>
