</head>

<body>

<div class="card">

    <div class="logo">
        🤖
    </div>

    <h1>PedroGPT</h1>

    <div class="subtitulo">
        Entre na sua conta
    </div>

    <div class="campo">
        <input
            type="text"
            id="username"
            placeholder="Usuário"
            autocomplete="username"
        >
    </div>

    <div class="campo">
        <input
            type="password"
            id="password"
            placeholder="Senha"
            autocomplete="current-password"
        >
    </div>

    <div
        id="erro"
        class="erro"
    ></div>

    <button
        id="btnLogin"
        onclick="login()"
    >
        Entrar
    </button>

    <a href="/register">
        Criar uma conta
    </a>

</div>

<script>

async function login() {

    const username =
        document
        .getElementById("username")
        .value
        .trim();

    const password =
        document
        .getElementById("password")
        .value
        .trim();

    const erro =
        document.getElementById("erro");

    const botao =
        document.getElementById("btnLogin");

    erro.style.display = "none";

    if (!username || !password) {

        mostrarErro(
            "Preencha o usuário e a senha."
        );

        return;
    }

    botao.disabled = true;
    botao.innerText = "Entrando...";

    try {

        const resposta =
            await fetch(
                "/api/login",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                }
            );

        const data =
            await resposta.json();

        if (data.success) {

            window.location.href = "/";

            return;
        }

        mostrarErro(
            data.message ||
            "Usuário ou senha inválidos."
        );

    } catch (error) {

        console.error(
            "Erro no login:",
            error
        );

        mostrarErro(
            "Não foi possível conectar ao servidor."
        );

    } finally {

        botao.disabled = false;
        botao.innerText = "Entrar";
    }
}


function mostrarErro(mensagem) {

    const erro =
        document.getElementById("erro");

    erro.innerText = mensagem;

    erro.style.display = "block";
}


// ENTER PARA ENTRAR
document.addEventListener(
    "DOMContentLoaded",
    function() {

        document
        .getElementById("username")
        .addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {
                    login();
                }

            }
        );

        document
        .getElementById("password")
        .addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {
                    login();
                }

            }
        );

    }
);

</script>

</body>
</html>
