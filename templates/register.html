
<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Criar conta - Orion AI</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {

    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;

    background:
        radial-gradient(
            circle at top,
            #312e81,
            #111827 55%,
            #05070d
        );

    color: white;
}

.card {

    width: 390px;
    max-width: 100%;

    padding: 35px;

    border-radius: 24px;

    background:
        rgba(255,255,255,0.07);

    backdrop-filter:
        blur(18px);

    border:
        1px solid
        rgba(255,255,255,0.12);

    box-shadow:
        0 25px 70px
        rgba(0,0,0,0.5);
}

.logo {

    text-align: center;

    margin-bottom: 28px;
}

.logo h1 {

    font-size: 30px;

    margin-bottom: 7px;
}

.logo p {

    color:
        rgba(255,255,255,0.65);

    font-size: 14px;
}

.campo {

    margin-bottom: 17px;
}

.campo label {

    display: block;

    margin-bottom: 7px;

    font-size: 14px;

    color:
        rgba(255,255,255,0.85);
}

.input-box {

    position: relative;
}

.input-box input {

    width: 100%;

    padding: 14px;

    border-radius: 12px;

    border:
        1px solid
        rgba(255,255,255,0.1);

    outline: none;

    background:
        rgba(255,255,255,0.08);

    color: white;

    font-size: 14px;

    transition: 0.2s;
}

.input-box input:focus {

    border-color:
        #8b5cf6;

    box-shadow:
        0 0 0 3px
        rgba(139,92,246,0.15);
}

.input-box input::placeholder {

    color:
        rgba(255,255,255,0.4);
}

.password-box input {

    padding-right: 52px;
}

.eye {

    position: absolute;

    right: 13px;
    top: 50%;

    transform:
        translateY(-50%);

    width: 30px;
    height: 30px;

    display: flex;

    align-items: center;
    justify-content: center;

    border: none;

    background: transparent;

    color: white;

    cursor: pointer;

    font-size: 18px;

    opacity: 0.75;

    transition: .15s ease;
}

.eye:hover {

    opacity: 1;

    transform:
        translateY(-50%)
        scale(1.08);
}

.forca {

    height: 5px;

    width: 100%;

    background:
        rgba(255,255,255,0.1);

    border-radius: 10px;

    margin-top: 8px;

    overflow: hidden;
}

.forca-bar {

    height: 100%;

    width: 0%;

    border-radius: 10px;

    transition: 0.25s;
}

.requisitos {

    margin-top: 8px;

    font-size: 12px;

    color:
        rgba(255,255,255,0.55);
}

.requisitos span {

    display: block;

    margin-top: 3px;
}

.requisito-ok {

    color:
        #4ade80 !important;
}

.requisito-erro {

    color:
        #f87171 !important;
}

.btn {

    width: 100%;

    padding: 14px;

    margin-top: 8px;

    border: none;

    border-radius: 12px;

    background:
        linear-gradient(
            90deg,
            #7c3aed,
            #4f46e5
        );

    color: white;

    font-size: 15px;

    font-weight: bold;

    cursor: pointer;

    transition: 0.2s;
}

.btn:hover {

    transform:
        translateY(-2px);

    box-shadow:
        0 8px 25px
        rgba(79,70,229,0.35);
}

.btn:disabled {

    opacity: 0.55;

    cursor: not-allowed;

    transform: none;
}

.msg {

    min-height: 20px;

    margin-top: 15px;

    text-align: center;

    font-size: 14px;
}

.erro {

    color:
        #f87171;
}

.sucesso {

    color:
        #4ade80;
}

.login {

    text-align: center;

    margin-top: 20px;

    font-size: 14px;

    color:
        rgba(255,255,255,0.65);
}

.login a {

    color:
        #a78bfa;

    text-decoration: none;

    font-weight: bold;
}

.login a:hover {

    text-decoration: underline;
}

@media(max-width:600px) {

    .card {

        padding: 25px 20px;

    }

}

</style>

</head>

<body>

<div class="card">

    <div class="logo">

        <h1>
            🤖 Orion AI
        </h1>

        <p>
            Crie sua conta gratuitamente
        </p>

    </div>


    <!-- ====================================================
         USUÁRIO
    ===================================================== -->

    <div class="campo">

        <label for="username">
            Usuário
        </label>

        <div class="input-box">

            <input
                type="text"
                id="username"
                placeholder="Escolha seu usuário"
                autocomplete="username"
                maxlength="30"
            >

        </div>

    </div>


    <!-- ====================================================
         SENHA
    ===================================================== -->

    <div class="campo">

        <label for="password">
            Senha
        </label>

        <div class="input-box password-box">

            <input
                type="password"
                id="password"
                placeholder="Crie uma senha"
                autocomplete="new-password"
            >

            <button
                type="button"
                class="eye"
                id="eye"
                onclick="toggleSenha()"
                aria-label="Mostrar senha"
            >
                👁️
            </button>

        </div>


        <div class="forca">

            <div
                id="forcaBar"
                class="forca-bar"
            ></div>

        </div>


        <div class="requisitos">

            <span id="reqTamanho">
                ○ Pelo menos 6 caracteres
            </span>

            <span id="reqNumero">
                ○ Pelo menos 1 número
            </span>

        </div>

    </div>


    <!-- ====================================================
         CONFIRMAR SENHA
    ===================================================== -->

    <div class="campo">

        <label for="confirmPassword">
            Confirmar senha
        </label>

        <div class="input-box password-box">

            <input
                type="password"
                id="confirmPassword"
                placeholder="Digite a senha novamente"
                autocomplete="new-password"
            >

            <button
                type="button"
                class="eye"
                id="eyeConfirm"
                onclick="toggleConfirmacao()"
                aria-label="Mostrar confirmação"
            >
                👁️
            </button>

        </div>

    </div>


    <!-- ====================================================
         BOTÃO
    ===================================================== -->

    <button
        class="btn"
        id="btnRegister"
        onclick="register()"
        type="button"
    >
        Criar conta
    </button>


    <!-- ====================================================
         MENSAGEM
    ===================================================== -->

    <div
        id="msg"
        class="msg"
    ></div>


    <!-- ====================================================
         LOGIN
    ===================================================== -->

    <div class="login">

        Já possui uma conta?

        <a href="/login">
            Entrar
        </a>

    </div>

</div>


<script>

/* ============================================================
   ELEMENTOS
============================================================ */

const username =
    document.getElementById("username");

const password =
    document.getElementById("password");

const confirmPassword =
    document.getElementById("confirmPassword");

const btn =
    document.getElementById("btnRegister");

const msg =
    document.getElementById("msg");

const eye =
    document.getElementById("eye");

const eyeConfirm =
    document.getElementById("eyeConfirm");


/* ============================================================
   MENSAGEM
============================================================ */

function mostrarMensagem(
    texto,
    tipo = "erro"
) {

    if (!msg) {
        return;
    }

    msg.textContent =
        texto;

    msg.className =
        "msg " + tipo;
}


/* ============================================================
   MOSTRAR / ESCONDER SENHA
============================================================ */

function toggleSenha() {

    if (!password || !eye) {
        return;
    }

    if (
        password.type === "password"
    ) {

        password.type = "text";

        eye.textContent =
            "🙈";

        eye.setAttribute(
            "aria-label",
            "Esconder senha"
        );

    } else {

        password.type = "password";

        eye.textContent =
            "👁️";

        eye.setAttribute(
            "aria-label",
            "Mostrar senha"
        );

    }

}


/* ============================================================
   MOSTRAR / ESCONDER CONFIRMAÇÃO
============================================================ */

function toggleConfirmacao() {

    if (
        !confirmPassword ||
        !eyeConfirm
    ) {
        return;
    }

    if (
        confirmPassword.type ===
        "password"
    ) {

        confirmPassword.type =
            "text";

        eyeConfirm.textContent =
            "🙈";

        eyeConfirm.setAttribute(
            "aria-label",
            "Esconder confirmação"
        );

    } else {

        confirmPassword.type =
            "password";

        eyeConfirm.textContent =
            "👁️";

        eyeConfirm.setAttribute(
            "aria-label",
            "Mostrar confirmação"
        );

    }

}


/* ============================================================
   FORÇA DA SENHA
============================================================ */

password.addEventListener(
    "input",
    atualizarForca
);

function atualizarForca() {

    const senha =
        password.value;

    const barra =
        document.getElementById(
            "forcaBar"
        );

    const reqTamanho =
        document.getElementById(
            "reqTamanho"
        );

    const reqNumero =
        document.getElementById(
            "reqNumero"
        );

    if (
        !barra ||
        !reqTamanho ||
        !reqNumero
    ) {
        return;
    }


    let pontos = 0;


    /* TAMANHO */

    if (
        senha.length >= 6
    ) {

        pontos++;

        reqTamanho.textContent =
            "✓ Pelo menos 6 caracteres";

        reqTamanho.className =
            "requisito-ok";

    } else {

        reqTamanho.textContent =
            "○ Pelo menos 6 caracteres";

        reqTamanho.className =
            "requisito-erro";

    }


    /* NÚMERO */

    if (
        /\d/.test(senha)
    ) {

        pontos++;

        reqNumero.textContent =
            "✓ Pelo menos 1 número";

        reqNumero.className =
            "requisito-ok";

    } else {

        reqNumero.textContent =
            "○ Pelo menos 1 número";

        reqNumero.className =
            "requisito-erro";

    }


    /* TAMANHO EXTRA */

    if (
        senha.length >= 10
    ) {

        pontos++;

    }


    /* MAIÚSCULA */

    if (
        /[A-Z]/.test(senha)
    ) {

        pontos++;

    }


    /* SÍMBOLO */

    if (
        /[^A-Za-z0-9]/.test(senha)
    ) {

        pontos++;

    }


    const porcentagem =
        Math.min(
            pontos * 20,
            100
        );

    barra.style.width =
        porcentagem + "%";

}


/* ============================================================
   REGISTRO
============================================================ */

async function register() {

    const nome =
        username.value.trim();

    const senha =
        password.value;

    const confirmacao =
        confirmPassword.value;


    /* VALIDAÇÕES */

    if (!nome) {

        mostrarMensagem(
            "Digite um nome de usuário."
        );

        username.focus();

        return;
    }


    if (
        nome.length < 3
    ) {

        mostrarMensagem(
            "O usuário precisa ter pelo menos 3 caracteres."
        );

        username.focus();

        return;
    }


    if (
        senha.length < 6
    ) {

        mostrarMensagem(
            "A senha precisa ter pelo menos 6 caracteres."
        );

        password.focus();

        return;
    }


    if (
        !/\d/.test(senha)
    ) {

        mostrarMensagem(
            "A senha precisa ter pelo menos 1 número."
        );

        password.focus();

        return;
    }


    if (
        senha !== confirmacao
    ) {

        mostrarMensagem(
            "As senhas não são iguais."
        );

        confirmPassword.focus();

        return;
    }


    /* CARREGANDO */

    btn.disabled = true;

    btn.textContent =
        "Criando conta...";

    mostrarMensagem("");


    try {

        const resposta =
            await fetch(
                "/api/register",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json",

                        "Accept":
                            "application/json"
                    },

                    credentials:
                        "same-origin",

                    body:
                        JSON.stringify({
                            username:
                                nome,

                            password:
                                senha
                        })
                }
            );


        let data = {};

        try {

            data =
                await resposta.json();

        } catch (erroJson) {

            data = {};

        }


        /* SUCESSO */

        if (
            resposta.ok &&
            data.success
        ) {

            mostrarMensagem(
                "Conta criada com sucesso!",
                "sucesso"
            );

            btn.textContent =
                "Conta criada ✓";

            setTimeout(
                function () {

                    window.location.href =
                        "/login";

                },
                900
            );

            return;
        }


        /* ERRO */

        mostrarMensagem(
            data.message ||
            "Não foi possível criar a conta."
        );


    } catch (erro) {

        console.error(
            "Erro no registro:",
            erro
        );

        mostrarMensagem(
            "Erro ao conectar com o servidor."
        );

    }


    btn.disabled = false;

    btn.textContent =
        "Criar conta";

}


/* ============================================================
   ENTER
============================================================ */

[
    username,
    password,
    confirmPassword
].forEach(
    function (campo) {

        if (!campo) {
            return;
        }

        campo.addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key === "Enter"
                ) {

                    event.preventDefault();

                    register();

                }

            }
        );

    }
);

</script>

</body>

</html>
