<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Orion AI</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    display: flex;
    height: 100vh;
    overflow: hidden;

    background:
        radial-gradient(
            circle at top,
            #111827,
            #0b0f19 60%,
            #05070d
        );

    color: white;
}

/* =========================
   SIDEBAR
========================= */

.sidebar {
    width: 280px;
    flex-shrink: 0;

    background: rgba(255,255,255,0.035);

    backdrop-filter: blur(18px);

    border-right: 1px solid rgba(255,255,255,0.08);

    padding: 18px;

    display: flex;
    flex-direction: column;
    gap: 14px;

    overflow: hidden;
}

.logo {
    text-align: center;
    padding: 8px 0 12px;
}

.logo h2 {
    font-size: 22px;
}

.usuario {
    padding: 12px;
    border-radius: 12px;

    background: rgba(255,255,255,0.05);

    border: 1px solid rgba(255,255,255,0.07);

    text-align: center;
    font-size: 14px;

    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

/* =========================
   PLANO
========================= */

.plano {
    text-align: center;

    padding: 7px;
    border-radius: 9px;

    font-size: 12px;
    font-weight: bold;

    background: rgba(124,58,237,0.15);

    border: 1px solid rgba(124,58,237,0.25);

    color: #c4b5fd;
}

/* =========================
   NOVA CONVERSA
========================= */

.nova-conversa {
    width: 100%;
    border: none;

    background:
        linear-gradient(
            135deg,
            #10b981,
            #059669
        );

    color: white;

    padding: 12px;
    border-radius: 11px;

    cursor: pointer;
    font-weight: bold;

    transition: 0.2s;
}

.nova-conversa:hover {
    transform: translateY(-1px);

    box-shadow:
        0 7px 20px
        rgba(16,185,129,0.25);
}

/* =========================
   TÍTULO DAS CONVERSAS
========================= */

.lista-titulo {
    font-size: 12px;

    color: rgba(255,255,255,0.5);

    margin-top: 5px;

    text-align: center;
}

/* =========================
   LISTA DE CONVERSAS
========================= */

.conversas {
    flex: 1;

    overflow-y: auto;

    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 4px;

    padding: 2px 0;
}

.conversas::-webkit-scrollbar {
    width: 4px;
}

.conversas::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,0.12);
    border-radius: 10px;
}

/*
   IMPORTANTE:
   As conversas agora ficam como
   texto simples, sem retângulos.
*/

.conversa-item {
    width: 92%;

    padding: 9px 8px;

    border: none;

    border-radius: 8px;

    background: transparent;

    color: rgba(255,255,255,0.75);

    text-align: center;

    cursor: pointer;

    transition: 0.2s;

    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;

    font-size: 13px;
}

.conversa-item:hover {
    background: rgba(255,255,255,0.06);

    color: white;
}

.conversa-item.ativa {
    background: rgba(124,58,237,0.15);

    color: white;
}

/* =========================
   LOGOUT
========================= */

.logout {
    display: block;

    text-decoration: none;
    color: white;

    background: rgba(255,255,255,0.07);

    padding: 11px;

    border-radius: 10px;

    text-align: center;

    transition: 0.2s;
}

.logout:hover {
    background: rgba(255,255,255,0.12);
}

/* =========================
   MAIN
========================= */

.main {
    flex: 1;
    min-width: 0;

    display: flex;
    flex-direction: column;

    height: 100vh;

    position: relative;
}

/* =========================
   HEADER
========================= */

.header {
    height: 62px;
    flex-shrink: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 0 18px;

    border-bottom: 1px solid rgba(255,255,255,0.06);

    background: rgba(255,255,255,0.025);

    backdrop-filter: blur(12px);

    font-weight: bold;

    position: relative;
    z-index: 20;
}

/* =========================
   OPÇÕES
========================= */

.opcoes {
    padding: 9px 18px;

    border-bottom: 1px solid rgba(255,255,255,0.05);

    font-size: 13px;

    color: rgba(255,255,255,0.75);

    flex-shrink: 0;

    position: relative;
    z-index: 20;
}

.opcoes label {
    cursor: pointer;
    user-select: none;
}

.opcoes input {
    accent-color: #7c3aed;
    cursor: pointer;
}

/* =========================
   ÁREA DO CHAT
========================= */

.chat-area {
    position: relative;

    flex: 1;

    min-height: 0;

    display: flex;
    flex-direction: column;

    overflow: hidden;
}

/* =========================
   CHAT
========================= */

.chat {
    flex: 1;

    min-height: 0;

    overflow-y: auto;

    padding: 24px;

    display: flex;
    flex-direction: column;

    gap: 13px;

    scroll-behavior: smooth;

    position: relative;
    z-index: 1;
}

.chat::-webkit-scrollbar {
    width: 7px;
}

.chat::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,0.15);

    border-radius: 10px;
}

/* =========================
   MENSAGENS
========================= */

.msg-user,
.msg-bot {
    max-width: 78%;

    padding: 12px 14px;

    animation: pop 0.15s ease;

    box-shadow:
        0 8px 22px
        rgba(0,0,0,0.18);
}

.msg-user {
    align-self: flex-end;

    border-radius:
        17px
        17px
        4px
        17px;

    background:
        linear-gradient(
            135deg,
            #7c3aed,
            #4f46e5
        );
}

.msg-bot {
    align-self: flex-start;

    border-radius:
        17px
        17px
        17px
        4px;

    background:
        rgba(255,255,255,0.06);

    border:
        1px solid
        rgba(255,255,255,0.08);

    backdrop-filter: blur(10px);
}

/* =========================
   CONTEÚDO
========================= */

.conteudo-mensagem {
    line-height: 1.6;

    word-wrap: break-word;

    overflow-wrap: break-word;
}

.conteudo-mensagem strong {
    font-weight: 700;
}

.conteudo-mensagem em {
    font-style: italic;
}

.linha-resposta {
    margin-bottom: 6px;
}

.linha-resposta:last-child {
    margin-bottom: 0;
}

.quebra-linha {
    height: 8px;
}

/* =========================
   TÍTULOS
========================= */

.conteudo-mensagem h2 {
    font-size: 20px;
    margin: 10px 0 8px;
}

.conteudo-mensagem h3 {
    font-size: 18px;
    margin: 10px 0 8px;
}

.conteudo-mensagem h4 {
    font-size: 16px;
    margin: 8px 0 6px;
}

/* =========================
   LISTAS
========================= */

.conteudo-mensagem ul,
.conteudo-mensagem ol {
    margin: 8px 0 10px 20px;

    padding-left: 18px;
}

.conteudo-mensagem li {
    margin-bottom: 7px;

    line-height: 1.55;
}

/* =========================
   CÓDIGO
========================= */

.codigo-pedrogpt {
    display: block;

    margin: 10px 0;

    padding: 14px;

    border-radius: 10px;

    background: rgba(0,0,0,0.5);

    border:
        1px solid
        rgba(255,255,255,0.1);

    overflow-x: auto;

    white-space: pre;

    font-family:
        Consolas,
        Monaco,
        monospace;

    font-size: 13px;

    line-height: 1.5;
}

.codigo-pedrogpt code {
    font-family:
        Consolas,
        Monaco,
        monospace;
}

/* =========================
   TYPING
========================= */

.typing-message {
    opacity: 0.9;
}

.typing-dots {
    display: inline-flex;

    gap: 4px;

    margin-left: 5px;
}

.typing-dots span {
    width: 6px;

    height: 6px;

    border-radius: 50%;

    background: #c4b5fd;

    animation: typing 1.2s infinite;
}

.typing-dots span:nth-child(2) {
    animation-delay: .15s;
}

.typing-dots span:nth-child(3) {
    animation-delay: .3s;
}

/* =========================
   WELCOME
========================= */

.welcome {
    position: absolute;

    inset: 0;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    gap: 14px;

    padding: 20px;

    background:
        radial-gradient(
            circle at top,
            #111827,
            #0b0f19
        );

    text-align: center;

    z-index: 5;

    pointer-events: auto;
}

.welcome h2 {
    font-size: 28px;
}

.welcome p {
    color: rgba(255,255,255,0.6);
}

/* =========================
   QUICK ACTIONS
========================= */

.quick-actions {
    display: flex;

    gap: 10px;

    flex-wrap: wrap;

    justify-content: center;

    max-width: 600px;

    margin-top: 8px;
}

.quick {
    padding: 11px 15px;

    border-radius: 11px;

    background: rgba(255,255,255,0.07);

    border:
        1px solid
        rgba(255,255,255,0.08);

    cursor: pointer;

    transition: .2s;

    font-size: 14px;
}

.quick:hover {
    transform: translateY(-2px);

    background: rgba(255,255,255,0.13);
}

/* =========================
   ENTRADA
========================= */

.entrada {
    flex-shrink: 0;

    display: flex;

    gap: 10px;

    padding: 14px;

    border-top:
        1px solid
        rgba(255,255,255,0.06);

    background:
        rgba(0,0,0,0.25);

    backdrop-filter:
        blur(14px);

    position: relative;

    z-index: 30;
}

.entrada input {
    flex: 1;

    min-width: 0;

    padding: 14px;

    border-radius: 13px;

    border:
        1px solid
        rgba(255,255,255,0.1);

    background:
        rgba(255,255,255,0.06);

    color: white;

    outline: none;
}

.entrada input:focus {
    border-color: #7c3aed;

    box-shadow:
        0 0 0 3px
        rgba(124,58,237,0.12);
}

.entrada input::placeholder {
    color: rgba(255,255,255,0.45);
}

.entrada button {
    padding: 14px 20px;

    border-radius: 13px;

    border: none;

    cursor: pointer;

    background:
        linear-gradient(
            135deg,
            #7c3aed,
            #4f46e5
        );

    color: white;

    font-weight: bold;

    transition: 0.2s;
}

.entrada button:hover {
    transform: translateY(-1px);
}

.entrada button:disabled {
    opacity: .55;

    cursor: not-allowed;

    transform: none;
}

/* =========================
   HIDDEN
========================= */

.hidden {
    display: none !important;
}

/* =========================
   ANIMAÇÕES
========================= */

@keyframes pop {

    from {
        opacity: 0;

        transform:
            translateY(5px)
            scale(.98);
    }

    to {
        opacity: 1;

        transform:
            translateY(0)
            scale(1);
    }
}

@keyframes typing {

    0%,
    60%,
    100% {
        opacity: .3;

        transform:
            translateY(0);
    }

    30% {
        opacity: 1;

        transform:
            translateY(-3px);
    }
}

/* =========================
   MOBILE
========================= */

@media(max-width: 768px) {

    body {
        flex-direction: column;
    }

    .sidebar {
        width: 100%;

        height: auto;

        max-height: 190px;

        padding: 10px;

        gap: 8px;

        border-right: none;

        border-bottom:
            1px solid
            rgba(255,255,255,0.08);
    }

    .logo {
        padding: 0;
    }

    .logo h2 {
        font-size: 19px;
    }

    .usuario {
        padding: 8px;
    }

    .plano {
        padding: 6px;
    }

    .nova-conversa {
        padding: 9px;
    }

    .conversas {
        display: none;
    }

    .logout {
        padding: 8px;
    }

    .main {
        height: calc(100vh - 190px);
    }

    .chat {
        padding: 13px;
    }

    .msg-user,
    .msg-bot {
        max-width: 91%;
    }

    .entrada {
        padding: 9px;
    }

    .entrada input {
        padding: 12px;
    }

    .entrada button {
        padding: 12px 15px;
    }
}

</style>

</head>

<body>

<aside class="sidebar">

```
<div class="logo">
    <h2>🤖 Orion AI</h2>
</div>

<div class="usuario">
    Olá, {{ username }}
</div>

<div class="plano">

    {% if plan == "premium" %}
        ⭐ Plano PREMIUM
    {% else %}
        🆓 Plano FREE
    {% endif %}

</div>

<button
    class="nova-conversa"
    type="button"
    onclick="novaConversa()"
>
    🆕 Nova conversa
</button>

<div class="lista-titulo">
    Suas conversas
</div>

<div
    id="conversas"
    class="conversas"
></div>

<a
    href="/logout"
    class="logout"
>
    🚪 Sair
</a>
```

</aside>

<main class="main">

```
<header class="header">

    <span id="tituloConversa">
        Orion AI
    </span>

</header>

<div class="opcoes">

    <label>

        <input
            type="checkbox"
            id="voz"
            checked
        >

        🔊 Ouvir respostas

    </label>

</div>

<div class="chat-area">

    <div
        id="chat"
        class="chat"
    ></div>

    <div
        id="welcome"
        class="welcome"
    >

        <h2>
            🤖 Orion AI
        </h2>

        <p>
            Como posso ajudar hoje?
        </p>

        <div class="quick-actions">

            <div
                class="quick"
                onclick="atalho('Criar código')"
            >
                💻 Criar código
            </div>

            <div
                class="quick"
                onclick="atalho('Estudar')"
            >
                📚 Estudar
            </div>

            <div
                class="quick"
                onclick="atalho('Fazer resumo')"
            >
                📝 Fazer resumo
            </div>

            <div
                class="quick"
                onclick="atalho('Tirar dúvidas')"
            >
                ❓ Tirar dúvidas
            </div>

        </div>

    </div>

</div>

<div class="entrada">

    <input
        type="text"
        id="mensagem"
        placeholder="Digite sua mensagem..."
        autocomplete="off"
    >

    <button
        id="btnEnviar"
        type="button"
        onclick="enviar()"
    >
        Enviar
    </button>

</div>
```

</main>

<script>

function atalho(texto) {

    const welcome =
        document.getElementById("welcome");

    const campo =
        document.getElementById("mensagem");

    if (welcome) {
        welcome.classList.add("hidden");
    }

    if (campo) {
        campo.value = texto;
        campo.focus();
    }

}

function esconderWelcome() {

    const welcome =
        document.getElementById("welcome");

    if (welcome) {
        welcome.classList.add("hidden");
    }

}

</script>

<script src="/static/script.js"></script>

</body>

</html>
