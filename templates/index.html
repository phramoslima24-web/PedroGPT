<!DOCTYPE html>

<html lang="pt-BR">

<head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Orion AI</title>

<style> * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; } body { display: flex; height: 100vh; overflow: hidden; background: radial-gradient(circle at 15% 10%, rgba(124,58,237,.18), transparent 28%), radial-gradient(circle at 85% 90%, rgba(79,70,229,.12), transparent 30%), linear-gradient(135deg,#05070d,#0b0f19 55%,#111827); color: white; } /* ========================= SIDEBAR ========================= */ .sidebar { width: 280px; flex-shrink: 0; background: rgba(255,255,255,.035); backdrop-filter: blur(22px); border-right: 1px solid rgba(255,255,255,.08); padding: 18px; display: flex; flex-direction: column; gap: 14px; overflow: hidden; } .logo { text-align: center; padding: 8px 0 12px; } .logo h2 { font-size: 22px; letter-spacing: .3px; text-shadow: 0 0 20px rgba(124,58,237,.45); } .usuario { padding: 12px; border-radius: 13px; background: rgba(255,255,255,.045); border: 1px solid rgba(255,255,255,.07); text-align: center; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; transition: .25s; } .usuario:hover { background: rgba(255,255,255,.07); } .plano { text-align: center; padding: 8px; border-radius: 10px; font-size: 12px; font-weight: bold; background: linear-gradient( 135deg, rgba(124,58,237,.18), rgba(79,70,229,.12) ); border: 1px solid rgba(124,58,237,.25); color: #c4b5fd; box-shadow: 0 0 20px rgba(124,58,237,.06); } .nova-conversa { width: 100%; border: none; background: linear-gradient(135deg,#10b981,#059669); color: white; padding: 13px; border-radius: 12px; cursor: pointer; font-weight: bold; transition: .25s; box-shadow: 0 5px 18px rgba(16,185,129,.12); } .nova-conversa:hover { transform: translateY(-2px); box-shadow: 0 9px 25px rgba(16,185,129,.25); } .nova-conversa:active { transform: scale(.98); } .logout { display: block; text-decoration: none; color: white; background: rgba(255,255,255,.055); padding: 11px; border-radius: 11px; text-align: center; transition: .25s; margin-top: auto; border: 1px solid transparent; } .logout:hover { background: rgba(239,68,68,.10); border-color: rgba(239,68,68,.15); } /* ========================= MAIN ========================= */ .main { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100vh; position: relative; } /* ========================= HEADER ========================= */ .header { height: 62px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; padding: 0 18px; border-bottom: 1px solid rgba(255,255,255,.06); background: rgba(255,255,255,.025); backdrop-filter: blur(18px); font-weight: bold; position: relative; z-index: 20; } #tituloConversa { font-size: 16px; text-shadow: 0 0 18px rgba(255,255,255,.12); } /* ========================= OPÇÕES ========================= */ .opcoes { padding: 9px 18px; border-bottom: 1px solid rgba(255,255,255,.05); font-size: 13px; color: rgba(255,255,255,.75); flex-shrink: 0; position: relative; z-index: 20; } .opcoes label { cursor: pointer; user-select: none; } .opcoes input { accent-color: #7c3aed; cursor: pointer; } /* ========================= CHAT AREA ========================= */ .chat-area { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; } /* ========================= CHAT ========================= */ .chat { flex: 1; min-height: 0; overflow-y: auto; padding: 28px; display: flex; flex-direction: column; gap: 15px; scroll-behavior: smooth; position: relative; z-index: 1; } .chat::-webkit-scrollbar { width: 6px; } .chat::-webkit-scrollbar-track { background: transparent; } .chat::-webkit-scrollbar-thumb { background: rgba(255,255,255,.13); border-radius: 20px; } .chat::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.22); } /* ========================= MENSAGENS ========================= */ .msg-user, .msg-bot { max-width: 78%; padding: 13px 16px; animation: messageIn .25s ease; box-shadow: 0 10px 28px rgba(0,0,0,.20); transition: transform .2s; } .msg-user:hover, .msg-bot:hover { transform: translateY(-1px); } .msg-user { align-self: flex-end; border-radius: 18px 18px 5px 18px; background: linear-gradient(135deg,#7c3aed,#4f46e5); box-shadow: 0 10px 28px rgba(79,70,229,.18), inset 0 1px 0 rgba(255,255,255,.08); } .msg-bot { align-self: flex-start; border-radius: 18px 18px 18px 5px; background: rgba(255,255,255,.055); border: 1px solid rgba(255,255,255,.085); backdrop-filter: blur(14px); box-shadow: 0 10px 28px rgba(0,0,0,.20), inset 0 1px 0 rgba(255,255,255,.025); } /* ========================= CONTEÚDO ========================= */ .conteudo-mensagem { line-height: 1.65; word-wrap: break-word; overflow-wrap: break-word; } .conteudo-mensagem strong { font-weight: 700; } .conteudo-mensagem em { font-style: italic; } .linha-resposta { margin-bottom: 6px; } .linha-resposta:last-child { margin-bottom: 0; } .quebra-linha { height: 8px; } /* ========================= TÍTULOS ========================= */ .conteudo-mensagem h2 { font-size: 20px; margin: 10px 0 8px; } .conteudo-mensagem h3 { font-size: 18px; margin: 10px 0 8px; } .conteudo-mensagem h4 { font-size: 16px; margin: 8px 0 6px; } /* ========================= LISTAS ========================= */ .conteudo-mensagem ul, .conteudo-mensagem ol { margin: 8px 0 10px 20px; padding-left: 18px; } .conteudo-mensagem li { margin-bottom: 7px; line-height: 1.55; } /* ========================= CÓDIGO ========================= */ .codigo-pedrogpt { display: block; margin: 11px 0; padding: 15px; border-radius: 11px; background: rgba(0,0,0,.48); border: 1px solid rgba(255,255,255,.10); overflow-x: auto; white-space: pre; font-family: Consolas, Monaco, monospace; font-size: 13px; line-height: 1.55; box-shadow: inset 0 0 25px rgba(0,0,0,.18); } .codigo-pedrogpt code { font-family: Consolas, Monaco, monospace; } /* ========================= TYPING ========================= */ .typing-message { opacity: .9; } .typing-dots { display: inline-flex; gap: 4px; margin-left: 5px; } .typing-dots span { width: 6px; height: 6px; border-radius: 50%; background: #c4b5fd; animation: typing 1.2s infinite; box-shadow: 0 0 8px rgba(196,181,253,.5); } .typing-dots span:nth-child(2) { animation-delay: .15s; } .typing-dots span:nth-child(3) { animation-delay: .3s; } /* ========================= WELCOME ========================= */ .welcome { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 14px; padding: 20px; background: radial-gradient(circle at center,rgba(124,58,237,.08),transparent 32%), radial-gradient(circle at top,#111827,#0b0f19); text-align: center; z-index: 5; pointer-events: auto; } .welcome h2 { font-size: 30px; letter-spacing: .3px; animation: welcomeGlow 3s ease-in-out infinite; } .welcome p { color: rgba(255,255,255,.6); font-size: 15px; } /* ========================= QUICK ACTIONS ========================= */ .quick-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; max-width: 600px; margin-top: 8px; } .quick { padding: 11px 16px; border-radius: 12px; background: rgba(255,255,255,.055); border: 1px solid rgba(255,255,255,.08); cursor: pointer; transition: .25s; font-size: 14px; backdrop-filter: blur(10px); } .quick:hover { transform: translateY(-3px); background: rgba(124,58,237,.13); border-color: rgba(124,58,237,.30); box-shadow: 0 8px 25px rgba(124,58,237,.12); } .quick:active { transform: scale(.97); } /* ========================= ENTRADA ========================= */ .entrada { flex-shrink: 0; display: flex; gap: 10px; padding: 15px; border-top: 1px solid rgba(255,255,255,.06); background: rgba(0,0,0,.28); backdrop-filter: blur(18px); position: relative; z-index: 30; } .entrada input { flex: 1; min-width: 0; padding: 14px 16px; border-radius: 14px; border: 1px solid rgba(255,255,255,.10); background: rgba(255,255,255,.055); color: white; outline: none; transition: .25s; } .entrada input:focus { border-color: rgba(124,58,237,.75); background: rgba(255,255,255,.07); box-shadow: 0 0 0 3px rgba(124,58,237,.11), 0 0 25px rgba(124,58,237,.05); } .entrada input::placeholder { color: rgba(255,255,255,.42); } .entrada button { padding: 14px 21px; border-radius: 14px; border: none; cursor: pointer; background: linear-gradient(135deg,#7c3aed,#4f46e5); color: white; font-weight: bold; transition: .25s; box-shadow: 0 6px 18px rgba(79,70,229,.15); } .entrada button:hover { transform: translateY(-2px); box-shadow: 0 9px 25px rgba(79,70,229,.25); } .entrada button:active { transform: scale(.97); } .entrada button:disabled { opacity: .55; cursor: not-allowed; transform: none; } /* ========================= HIDDEN ========================= */ .hidden { display: none !important; } /* ========================= ANIMAÇÕES ========================= */ @keyframes messageIn { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } } @keyframes typing { 0%,60%,100% { opacity: .3; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } } @keyframes welcomeGlow { 0%,100% { text-shadow: 0 0 15px rgba(124,58,237,.20); } 50% { text-shadow: 0 0 30px rgba(124,58,237,.50); } } /* ========================= MOBILE ========================= */ @media(max-width:768px) { body { flex-direction: column; } .sidebar { width: 100%; height: auto; max-height: 190px; padding: 10px; gap: 8px; border-right: none; border-bottom: 1px solid rgba(255,255,255,.08); } .logo { padding: 0; } .logo h2 { font-size: 19px; } .usuario { padding: 8px; } .plano { padding: 6px; } .nova-conversa { padding: 9px; } .logout { padding: 8px; } .main { height: calc(100vh - 190px); } .chat { padding: 13px; } .msg-user, .msg-bot { max-width: 91%; } .entrada { padding: 9px; } .entrada input { padding: 12px; } .entrada button { padding: 12px 15px; } .welcome h2 { font-size: 25px; } } </style>

</head>

<body>

<aside class="sidebar">

<div class="logo"> <h2>🤖 Orion AI</h2> </div>

<div class="usuario"> Olá, {{ username }} </div>

<div class="plano">

{% if plan == "premium" %}
    ⭐ Plano PREMIUM
{% else %}
    🆓 Plano FREE
{% endif %}

</div>

<button
class="nova-conversa"
type="button"
onclick="novaConversa()"




🆕 Nova conversa

</button>

<a
href="/logout"
class="logout"




🚪 Sair

</a>

</aside>

<main class="main">

<header class="header">

<span id="tituloConversa">
    Orion AI
</span>

</header>

<div class="opcoes">

<label>

    <input
        type="checkbox"
        id="voz"
        checked
    >

    🔊 Ouvir respostas

</label>

</div>

<div class="chat-area">

<div
    id="chat"
    class="chat"
></div>

<div
    id="welcome"
    class="welcome"
>

    <h2>
        🤖 Orion AI
    </h2>

    <p>
        Como posso ajudar hoje?
    </p>

    <div class="quick-actions">

        <div
            class="quick"
            onclick="atalho('Criar código')"
        >
            💻 Criar código
        </div>

        <div
            class="quick"
            onclick="atalho('Estudar')"
        >
            📚 Estudar
        </div>

        <div
            class="quick"
            onclick="atalho('Fazer resumo')"
        >
            📝 Fazer resumo
        </div>

        <div
            class="quick"
            onclick="atalho('Tirar dúvidas')"
        >
            ❓ Tirar dúvidas
        </div>

    </div>

</div>

</div>

<div class="entrada">

<input
    type="text"
    id="mensagem"
    placeholder="Digite sua mensagem..."
    autocomplete="off"
>

<button
    id="btnEnviar"
    type="button"
    onclick="enviar()"
>
    Enviar
</button>

</div>

</main>

<script src="/static/script.js"></script>

</body>

</html>
