<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PedroGPT</title>


<style>

/* =========================
   RESET
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}


/* =========================
   BODY
========================= */

body {

    display: flex;

    height: 100vh;

    background:
        radial-gradient(
            circle at top,
            #111827,
            #0b0f19
        );

    color: white;
}


/* =========================
   SIDEBAR
========================= */

.sidebar {

    width: 260px;

    background:
        rgba(255,255,255,0.03);

    backdrop-filter: blur(12px);

    border-right:
        1px solid
        rgba(255,255,255,0.08);

    padding: 20px;

    display: flex;

    flex-direction: column;

    gap: 15px;

}


.sidebar h2 {

    text-align: center;

}


.usuario {

    background:
        rgba(255,255,255,0.05);

    padding: 12px;

    border-radius: 10px;

    text-align: center;

    font-size: 14px;

    border:
        1px solid
        rgba(255,255,255,0.06);

}


/* =========================
   NOVA CONVERSA
========================= */

.nova-conversa {

    border: none;

    background:
        linear-gradient(
            135deg,
            #10b981,
            #059669
        );

    color: white;

    padding: 12px;

    border-radius: 10px;

    cursor: pointer;

    font-weight: bold;

    transition: 0.2s;

}


.nova-conversa:hover {

    transform: scale(1.03);

}


/* =========================
   LOGOUT
========================= */

.logout {

    text-decoration: none;

    color: white;

    background:
        rgba(255,255,255,0.08);

    padding: 10px;

    border-radius: 10px;

    text-align: center;

}


/* =========================
   MAIN
========================= */

.main {

    flex: 1;

    display: flex;

    flex-direction: column;

    height: 100vh;

    min-width: 0;

}


/* =========================
   HEADER
========================= */

.header {

    padding: 18px;

    text-align: center;

    font-weight: bold;

    border-bottom:
        1px solid
        rgba(255,255,255,0.06);

    background:
        rgba(255,255,255,0.02);

}


/* =========================
   OPÇÕES
========================= */

.opcoes {

    padding: 10px 20px;

    border-bottom:
        1px solid
        rgba(255,255,255,0.06);

    font-size: 14px;

}


/* =========================
   CHAT
========================= */

.chat {

    flex: 1;

    overflow-y: auto;

    padding: 20px;

    display: flex;

    flex-direction: column;

    gap: 12px;

    scroll-behavior: smooth;

}


.chat::-webkit-scrollbar {

    width: 6px;

}


.chat::-webkit-scrollbar-thumb {

    background:
        rgba(255,255,255,0.15);

    border-radius: 10px;

}


/* =========================
   MENSAGENS
========================= */

.msg-user {

    align-self: flex-end;

    max-width: 75%;

    padding: 12px 14px;

    border-radius:
        16px
        16px
        4px
        16px;

    background:
        linear-gradient(
            135deg,
            #7c3aed,
            #4f46e5
        );

    color: white;

    box-shadow:
        0 8px 20px
        rgba(0,0,0,0.25);

    animation:
        pop 0.15s ease;

}


.msg-bot {

    align-self: flex-start;

    max-width: 75%;

    padding: 12px 14px;

    border-radius:
        16px
        16px
        16px
        4px;

    background:
        rgba(255,255,255,0.06);

    border:
        1px solid
        rgba(255,255,255,0.08);

    backdrop-filter: blur(10px);

    animation:
        pop 0.15s ease;

}


.conteudo-mensagem {

    line-height: 1.6;

    word-wrap: break-word;

    overflow-wrap: break-word;

}


.linha-resposta {

    margin-bottom: 6px;

}


.linha-resposta:last-child {

    margin-bottom: 0;

}


.conteudo-mensagem strong {

    font-weight: 700;

    color: white;

}


.conteudo-mensagem em {

    font-style: italic;

}


.conteudo-mensagem h2 {

    font-size: 20px;

    margin: 10px 0 8px 0;

}


.conteudo-mensagem h3 {

    font-size: 18px;

    margin: 10px 0 8px 0;

}


.conteudo-mensagem h4 {

    font-size: 16px;

    margin: 8px 0 6px 0;

}


.conteudo-mensagem ul {

    margin: 8px 0 10px 20px;

    padding-left: 18px;

}


.conteudo-mensagem ul li {

    margin-bottom: 7px;

    padding-left: 4px;

    line-height: 1.55;

}


.conteudo-mensagem ol {

    margin: 8px 0 10px 20px;

    padding-left: 18px;

}


.conteudo-mensagem ol li {

    margin-bottom: 7px;

    padding-left: 4px;

    line-height: 1.55;

}


.quebra-linha {

    height: 8px;

}


/* =========================
   CÓDIGO
========================= */

.codigo-pedrogpt {

    display: block;

    margin: 10px 0;

    padding: 14px;

    border-radius: 10px;

    background:
        rgba(0,0,0,0.45);

    border:
        1px solid
        rgba(255,255,255,0.10);

    overflow-x: auto;

    white-space: pre;

    font-family:
        Consolas,
        Monaco,
        monospace;

    font-size: 13px;

    line-height: 1.5;

}


/* =========================
   ÁREA DE ANEXOS
========================= */

.anexos {

    display: flex;

    flex-wrap: wrap;

    gap: 8px;

    margin-bottom: 8px;

}


.anexo {

    display: flex;

    align-items: center;

    gap: 8px;

    padding: 8px 10px;

    border-radius: 10px;

    background:
        rgba(255,255,255,0.08);

    border:
        1px solid
        rgba(255,255,255,0.1);

    font-size: 12px;

    max-width: 220px;

}


.anexo-nome {

    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;

}


.remover-anexo {

    border: none;

    background: transparent;

    color: #ff7777;

    cursor: pointer;

    font-size: 16px;

    padding: 0;

}


/* =========================
   IMAGEM ANEXADA
========================= */

.imagem-anexada {

    max-width: 260px;

    max-height: 260px;

    border-radius: 12px;

    display: block;

    margin-top: 8px;

    object-fit: contain;

}


/* =========================
   INPUT
========================= */

.entrada {

    display: flex;

    flex-direction: column;

    gap: 8px;

    padding: 15px;

    border-top:
        1px solid
        rgba(255,255,255,0.06);

    background:
        rgba(0,0,0,0.25);

    backdrop-filter: blur(10px);

}


/* =========================
   LINHA DO INPUT
========================= */

.entrada-linha {

    display: flex;

    gap: 10px;

    align-items: center;

}


/* =========================
   INPUT TEXTO
========================= */

.entrada input[type="text"] {

    flex: 1;

    min-width: 0;

    padding: 14px;

    border-radius: 12px;

    border:
        1px solid
        rgba(255,255,255,0.1);

    background:
        rgba(255,255,255,0.05);

    color: white;

    outline: none;

}


.entrada input[type="text"]::placeholder {

    color:
        rgba(255,255,255,0.5);

}


/* =========================
   BOTÃO ANEXAR
========================= */

.botao-anexo {

    width: 48px;

    height: 48px;

    border: none;

    border-radius: 12px;

    background:
        rgba(255,255,255,0.08);

    color: white;

    font-size: 21px;

    cursor: pointer;

    transition: 0.2s;

    flex-shrink: 0;

}


.botao-anexo:hover {

    background:
        rgba(255,255,255,0.15);

    transform: scale(1.05);

}


/* =========================
   BOTÃO ENVIAR
========================= */

.entrada-linha button.enviar {

    padding:
        14px
        18px;

    border-radius: 12px;

    border: none;

    cursor: pointer;

    background:
        linear-gradient(
            135deg,
            #7c3aed,
            #4f46e5
        );

    color: white;

    font-weight: bold;

    transition: 0.2s;

    flex-shrink: 0;

}


.entrada-linha button.enviar:hover {

    transform: scale(1.05);

}


/* =========================
   WELCOME
========================= */

.welcome {

    position: absolute;

    inset: 0;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    gap: 15px;

    background:
        radial-gradient(
            circle at top,
            #111827,
            #0b0f19
        );

    text-align: center;

    z-index: 999;

    pointer-events: auto;

}


.quick-actions {

    display: flex;

    gap: 10px;

    flex-wrap: wrap;

    justify-content: center;

}


.quick {

    padding:
        10px
        14px;

    border-radius: 10px;

    background:
        rgba(255,255,255,0.08);

    cursor: pointer;

    transition: 0.2s;

}


.quick:hover {

    transform: scale(1.05);

    background:
        rgba(255,255,255,0.15);

}


.hidden {

    display: none !important;

}


/* =========================
   ANIMAÇÃO
========================= */

@keyframes pop {

    from {

        opacity: 0;

        transform:
            translateY(5px)
            scale(0.98);

    }

    to {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);

    }

}


/* =========================
   MOBILE
========================= */

@media(max-width: 768px) {

    body {

        flex-direction: column;

    }


    .sidebar {

        width: 100%;

        flex-direction: row;

        flex-wrap: wrap;

        justify-content: space-between;

        padding: 10px;

    }


    .sidebar h2 {

        width: 100%;

    }


    .usuario {

        flex: 1;

    }


    .nova-conversa {

        flex: 1;

    }


    .logout {

        flex: 1;

    }


    .main {

        height: 100%;

    }


    .msg-user,
    .msg-bot {

        max-width: 90%;

    }


    .chat {

        padding: 12px;

    }


    .entrada {

        padding: 10px;

    }


    .entrada input[type="text"] {

        min-width: 0;

    }


    .botao-anexo {

        width: 44px;

        height: 44px;

    }


    .entrada-linha button.enviar {

        padding: 13px 15px;

    }

}

</style>

</head>


<body>


<!-- =========================
     SIDEBAR
========================= -->

<div class="sidebar">

    <h2>🤖 PedroGPT</h2>

    <div class="usuario">

        Olá, {{ username }}

    </div>


    <button
        class="nova-conversa"
        onclick="novaConversa()"
    >

        🆕 Nova Conversa

    </button>


    <a
        href="/logout"
        class="logout"
    >

        Sair

    </a>

</div>



<!-- =========================
     MAIN
========================= -->

<div class="main">


    <div class="header">

        PedroGPT

    </div>


    <!-- =====================
         OPÇÕES
    ====================== -->

    <div class="opcoes">

        <label>

            <input
                type="checkbox"
                id="voz"
                checked
            >

            🔊 Ouvir respostas

        </label>

    </div>


    <!-- =====================
         CHAT
    ====================== -->

    <div
        id="chat"
        class="chat"
    ></div>



    <!-- =====================
         WELCOME
    ====================== -->

    <div
        id="welcome"
        class="welcome"
    >

        <h2>
            🤖 PedroGPT
        </h2>


        <p>
            Como posso ajudar hoje?
        </p>


        <div class="quick-actions">

            <div
                class="msg-bot quick"
                onclick="atalho('Criar código 💻')"
            >

                💻 Criar código

            </div>


            <div
                class="msg-bot quick"
                onclick="atalho('Estudar 📚')"
            >

                📚 Estudar

            </div>


            <div
                class="msg-bot quick"
                onclick="atalho('Fazer resumo 📝')"
            >

                📝 Fazer resumo

            </div>


            <div
                class="msg-bot quick"
                onclick="atalho('Tirar dúvidas ❓')"
            >

                ❓ Tirar dúvidas

            </div>

        </div>

    </div>



    <!-- =====================
         ENTRADA
    ====================== -->

    <div class="entrada">


        <!-- ANEXOS SELECIONADOS -->

        <div
            id="anexos"
            class="anexos"
        ></div>


        <div class="entrada-linha">


            <!-- INPUT DE ARQUIVOS -->

            <input
                type="file"
                id="arquivo"
                multiple
                accept="image/*,.txt,.pdf,.doc,.docx,.xls,.xlsx,.csv,.json,.py,.js,.html,.css,.java,.cpp,.c"
                style="display:none"
            >


            <!-- BOTÃO ANEXAR -->

            <button
                type="button"
                class="botao-anexo"
                onclick="document.getElementById('arquivo').click()"
                title="Anexar arquivos"
            >

                📎

            </button>


            <!-- TEXTO -->

            <input
                type="text"
                id="mensagem"
                placeholder="Digite sua mensagem..."
                autocomplete="off"
            >


            <!-- ENVIAR -->

            <button
                class="enviar"
                onclick="enviar()"
            >

                Enviar

            </button>

        </div>

    </div>

</div>



<!-- =========================
     QUICK ACTION SCRIPT
========================= -->

<script>

function atalho(texto) {

    document
        .getElementById("welcome")
        .classList
        .add("hidden");


    document
        .getElementById("mensagem")
        .value = texto;


    document
        .getElementById("mensagem")
        .focus();

}


// =========================
// ARQUIVOS SELECIONADOS
// =========================

const inputArquivo =
    document.getElementById("arquivo");


if (inputArquivo) {

    inputArquivo.addEventListener(
        "change",
        function() {

            const container =
                document.getElementById("anexos");

            if (!container) return;

            container.innerHTML = "";


            Array.from(this.files).forEach(
                function(file, index) {

                    const div =
                        document.createElement("div");

                    div.className = "anexo";


                    let icone = "📄";


                    if (
                        file.type.startsWith("image/")
                    ) {

                        icone = "🖼️";

                    }


                    div.innerHTML = `

                        <span>
                            ${icone}
                        </span>

                        <span class="anexo-nome">
                            ${escapeHtml(file.name)}
                        </span>

                    `;


                    container.appendChild(div);

                }
            );

        }
    );

}


// =========================
// PROTEÇÃO HTML
// =========================

function escapeHtml(texto) {

    return String(texto || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}

</script>



<!-- =========================
     MARKED
========================= -->

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>


<!-- =========================
     PEDROGPT SCRIPT
========================= -->

<script src="/static/script.js"></script>


</body>

</html>
