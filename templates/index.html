
<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Orion AI</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    display: flex;
    height: 100vh;
    overflow: hidden;
    background:
        radial-gradient(
            circle at 15% 10%,
            rgba(124,58,237,.18),
            transparent 28%
        ),
        radial-gradient(
            circle at 85% 20%,
            rgba(79,70,229,.12),
            transparent 25%
        ),
        linear-gradient(
            135deg,
            #090d17,
            #0b1020 55%,
            #05070d
        );
    color: white;
}

/* =========================
   SIDEBAR
========================= */

.sidebar {
    width: 290px;
    flex-shrink: 0;
    background: rgba(9, 13, 24, .76);
    backdrop-filter: blur(24px);
    border-right: 1px solid rgba(255,255,255,.08);
    padding: 18px 14px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    overflow: hidden;
}

.logo {
    text-align: center;
    padding: 8px 0 10px;
}

.logo h2 {
    font-size: 23px;
    letter-spacing: .2px;
    text-shadow: 0 0 22px rgba(124,58,237,.35);
}

.usuario {
    padding: 11px 13px;
    border-radius: 13px;
    background: linear-gradient(
        135deg,
        rgba(255,255,255,.065),
        rgba(255,255,255,.025)
    );
    border: 1px solid rgba(255,255,255,.07);
    text-align: center;
    font-size: 14px;
    color: rgba(255,255,255,.88);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.plano {
    text-align: center;
    padding: 8px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: bold;
    background: linear-gradient(
        135deg,
        rgba(124,58,237,.16),
        rgba(79,70,229,.10)
    );
    border: 1px solid rgba(124,58,237,.25);
    color: #c4b5fd;
    box-shadow: inset 0 0 18px rgba(124,58,237,.04);
}

.nova-conversa {
    width: 100%;
    border: 1px solid rgba(255,255,255,.06);
    background: linear-gradient(
        135deg,
        #10b981,
        #059669
    );
    color: white;
    padding: 12px;
    border-radius: 12px;
    cursor: pointer;
    font-weight: bold;
    box-shadow: 0 8px 24px rgba(5,150,105,.16);
    transition: .2s ease;
}

.nova-conversa:hover {
    transform: translateY(-1px);
    filter: brightness(1.08);
    box-shadow: 0 10px 28px rgba(5,150,105,.22);
}

.nova-conversa:disabled {
    opacity: .6;
    cursor: not-allowed;
    transform: none;
}

/* =========================
   HISTÓRICO
========================= */

.historico-titulo {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 11px;
    color: rgba(255,255,255,.43);
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: .8px;
    padding: 7px 7px 4px;
}

.historico {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 7px;
    padding: 2px 3px 4px 2px;
}

.historico::-webkit-scrollbar {
    width: 5px;
}

.historico::-webkit-scrollbar-track {
    background: transparent;
}

.historico::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,.11);
    border-radius: 10px;
}

.historico::-webkit-scrollbar-thumb:hover {
    background: rgba(255,255,255,.18);
}

.conversa-item {
    position: relative;
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 6px;
    min-height: 46px;
    border-radius: 12px;
    background: rgba(255,255,255,.025);
    border: 1px solid rgba(255,255,255,.045);
    transition:
        background .18s ease,
        border-color .18s ease,
        transform .18s ease,
        box-shadow .18s ease;
}

.conversa-item:hover {
    background: rgba(255,255,255,.055);
    border-color: rgba(255,255,255,.085);
    transform: translateX(1px);
}

.conversa-item.ativa {
    background:
        linear-gradient(
            135deg,
            rgba(124,58,237,.18),
            rgba(79,70,229,.10)
        );
    border-color: rgba(124,58,237,.30);
    box-shadow:
        inset 3px 0 0 #7c3aed,
        0 5px 18px rgba(0,0,0,.12);
}

.conversa-item.selecionada {
    background:
        linear-gradient(
            135deg,
            rgba(124,58,237,.28),
            rgba(79,70,229,.18)
        ) !important;
    border-color: rgba(167,139,250,.42);
    box-shadow:
        inset 3px 0 0 #a78bfa,
        0 6px 20px rgba(76,29,149,.18);
}

.conversa-abrir {
    flex: 1;
    min-width: 0;
    min-height: 34px;
    border: none;
    background: transparent;
    color: white;
    text-align: left;
    cursor: pointer;
    overflow: hidden;
    padding: 0 6px;
}

.conversa-abrir:focus {
    outline: none;
}

.conversa-titulo {
    display: block;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 13px;
    color: rgba(255,255,255,.89);
}

.conversa-item.ativa .conversa-titulo {
    color: white;
    font-weight: 600;
}

.conversa-acoes {
    display: flex;
    align-items: center;
    gap: 2px;
    flex-shrink: 0;
}

.btn-conversa {
    width: 29px;
    height: 29px;
    border: 1px solid transparent;
    border-radius: 8px;
    background: transparent;
    color: rgba(255,255,255,.48);
    cursor: pointer;
    transition:
        .15s ease,
        transform .15s ease;
}

.btn-conversa:hover {
    background: rgba(255,255,255,.085);
    border-color: rgba(255,255,255,.05);
    color: white;
    transform: scale(1.04);
}

.btn-selecionar:hover {
    color: #c4b5fd;
}

.btn-renomear:hover {
    color: #facc15;
}

.btn-excluir:hover {
    color: #f87171;
    background: rgba(239,68,68,.10);
}

.historico-vazio {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 90px;
    text-align: center;
    padding: 14px 8px;
    color: rgba(255,255,255,.28);
    font-size: 12px;
}

/* =========================
   LOGOUT
========================= */

.logout {
    display: block;
    text-decoration: none;
    color: rgba(255,255,255,.84);
    background: rgba(255,255,255,.045);
    border: 1px solid rgba(255,255,255,.06);
    padding: 11px;
    border-radius: 11px;
    text-align: center;
    margin-top: auto;
    transition: .2s ease;
}

.logout:hover {
    background: rgba(255,255,255,.075);
    color: white;
}

/* =========================
   MAIN
========================= */

.main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    height: 100vh;
    position: relative;
}

/* =========================
   HEADER
========================= */

.header {
    height: 62px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 18px;
    border-bottom: 1px solid rgba(255,255,255,.055);
    background: rgba(255,255,255,.018);
    backdrop-filter: blur(16px);
    font-weight: bold;
    position: relative;
    z-index: 20;
}

#tituloConversa {
    max-width: 70%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

/* =========================
   BOTÃO PERFIL
========================= */

.botao-perfil {
    position: absolute;
    right: 18px;

    width: 40px;
    height: 40px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 11px;

    text-decoration: none;

    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.08);

    color: white;

    font-size: 20px;

    transition: .2s ease;

    cursor: pointer;
}

.botao-perfil:hover {
    background: rgba(255,255,255,.12);
    transform: rotate(20deg);
}

/* =========================
   OPÇÕES
========================= */

.opcoes {
    padding: 10px 18px;
    border-bottom: 1px solid rgba(255,255,255,.045);
    font-size: 13px;
    color: rgba(255,255,255,.75);
    flex-shrink: 0;
    position: relative;
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 18px;
    flex-wrap: wrap;
    background: rgba(255,255,255,.012);
}

.opcoes label {
    cursor: pointer;
    user-select: none;
}

.opcoes input {
    accent-color: #7c3aed;
    cursor: pointer;
}

.seletor-voz {
    display: flex;
    align-items: center;
    gap: 7px;
}

.seletor-voz select {
    max-width: 240px;
    padding: 7px 10px;
    border-radius: 9px;
    border: 1px solid rgba(255,255,255,.10);
    background: rgba(255,255,255,.07);
    color: white;
    outline: none;
    cursor: pointer;
}

.seletor-voz select option {
    background: #111827;
    color: white;
}

.btn-testar-voz {
    padding: 7px 11px;
    border-radius: 9px;
    border: 1px solid rgba(255,255,255,.10);
    background: rgba(255,255,255,.07);
    color: white;
    cursor: pointer;
    transition: .18s ease;
}

.btn-testar-voz:hover {
    background: rgba(255,255,255,.11);
}

/* =========================
   CHAT
========================= */

.chat-area {
    position: relative;
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.chat {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 26px;
    display: flex;
    flex-direction: column;
    gap: 13px;
    scroll-behavior: smooth;
    position: relative;
    z-index: 1;
}

.chat::-webkit-scrollbar {
    width: 6px;
}

.chat::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,.09);
    border-radius: 10px;
}

.msg-user,
.msg-bot {
    max-width: 78%;
    padding: 12px 14px;
    animation: pop .15s ease;
    box-shadow: 0 8px 22px rgba(0,0,0,.18);
}

.msg-user {
    align-self: flex-end;
    border-radius: 17px 17px 4px 17px;
    background: linear-gradient(
        135deg,
        #7c3aed,
        #4f46e5
    );
}

.msg-bot {
    align-self: flex-start;
    border-radius: 17px 17px 17px 4px;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.08);
}

.conteudo-mensagem {
    line-height: 1.6;
    word-wrap: break-word;
    overflow-wrap: break-word;
}

.conteudo-mensagem h2 {
    font-size: 20px;
    margin: 10px 0 8px;
}

.conteudo-mensagem h3 {
    font-size: 18px;
    margin: 10px 0 8px;
}

.conteudo-mensagem h4 {
    font-size: 16px;
    margin: 8px 0 6px;
}

.conteudo-mensagem ul,
.conteudo-mensagem ol {
    margin: 8px 0 10px 20px;
    padding-left: 18px;
}

.conteudo-mensagem li {
    margin-bottom: 7px;
}

.codigo-pedrogpt {
    display: block;
    margin: 10px 0;
    padding: 14px;
    border-radius: 10px;
    background: rgba(0,0,0,.5);
    border: 1px solid rgba(255,255,255,.1);
    overflow-x: auto;
    white-space: pre;
    font-family: Consolas, Monaco, monospace;
    font-size: 13px;
    line-height: 1.5;
}

/* =========================
   TYPING
========================= */

.typing-message {
    opacity: .9;
}

.typing-dots {
    display: inline-flex;
    gap: 4px;
    margin-left: 5px;
}

.typing-dots span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #c4b5fd;
    animation: typing 1.2s infinite;
}

.typing-dots span:nth-child(2) {
    animation-delay: .15s;
}

.typing-dots span:nth-child(3) {
    animation-delay: .3s;
}

/* =========================
   WELCOME
========================= */

.welcome {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 14px;
    padding: 20px;
    background:
        radial-gradient(
            circle at 50% 35%,
            rgba(124,58,237,.10),
            transparent 25%
        ),
        radial-gradient(
            circle at top,
            #111827,
            #0b0f19
        );
    text-align: center;
    z-index: 5;
    pointer-events: none;
}

.welcome.hidden {
    display: none !important;
}

.welcome h2 {
    font-size: 30px;
    text-shadow: 0 0 25px rgba(124,58,237,.28);
}

.welcome p {
    color: rgba(255,255,255,.58);
}

.quick-actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 600px;
}

.quick {
    padding: 11px 15px;
    border-radius: 11px;
    background: rgba(255,255,255,.065);
    border: 1px solid rgba(255,255,255,.08);
    cursor: pointer;
    pointer-events: auto;
    color: white;
    transition: .18s ease;
}

.quick:hover {
    background: rgba(255,255,255,.10);
    transform: translateY(-1px);
}

/* =========================
   ARQUIVO
========================= */

.arquivo-selecionado {
    display: none;
    align-items: center;
    gap: 8px;
    margin: 0 14px 8px;
    padding: 8px 11px;
    border-radius: 10px;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.08);
    font-size: 12px;
}

.arquivo-selecionado.ativo {
    display: flex;
}

.nome-arquivo {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.remover-arquivo {
    border: none;
    background: transparent;
    color: #f87171;
    cursor: pointer;
}

/* =========================
   ENTRADA
========================= */

.entrada {
    flex-shrink: 0;
    display: flex;
    gap: 10px;
    padding: 14px;
    border-top: 1px solid rgba(255,255,255,.055);
    background: rgba(0,0,0,.24);
    backdrop-filter: blur(18px);
    position: relative;
    z-index: 100;
}

.btn-arquivo {
    width: 48px;
    flex-shrink: 0;
    padding: 14px 0;
    border-radius: 13px;
    border: 1px solid rgba(255,255,255,.1);
    background: rgba(255,255,255,.07);
    color: white;
    cursor: pointer;
    font-size: 18px;
    transition: .18s ease;
}

.btn-arquivo:hover {
    background: rgba(255,255,255,.11);
}

.entrada input[type="text"] {
    flex: 1;
    min-width: 0;
    padding: 14px;
    border-radius: 13px;
    border: 1px solid rgba(255,255,255,.1);
    background: rgba(255,255,255,.06);
    color: white;
    outline: none;
    position: relative;
    z-index: 101;
    transition: .18s ease;
}

.entrada input[type="text"]:focus {
    border-color: rgba(124,58,237,.8);
    box-shadow: 0 0 0 3px rgba(124,58,237,.08);
}

.entrada button#btnEnviar {
    padding: 14px 20px;
    border-radius: 13px;
    border: none;
    cursor: pointer;
    background: linear-gradient(
        135deg,
        #7c3aed,
        #4f46e5
    );
    color: white;
    font-weight: bold;
    position: relative;
    z-index: 101;
    transition: .18s ease;
}

.entrada button#btnEnviar:hover {
    filter: brightness(1.08);
    transform: translateY(-1px);
}

.entrada button:disabled {
    opacity: .55;
    cursor: not-allowed;
    transform: none;
}

.hidden {
    display: none !important;
}

/* =========================
   ANIMAÇÕES
========================= */

@keyframes pop {

    from {
        opacity: 0;
        transform: translateY(5px) scale(.98);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }

}

@keyframes typing {

    0%,60%,100% {
        opacity: .3;
        transform: translateY(0);
    }

    30% {
        opacity: 1;
        transform: translateY(-3px);
    }

}

/* =========================
   MOBILE
========================= */

@media(max-width:768px) {

    body {
        flex-direction: column;
    }

    .sidebar {
        width: 100%;
        height: auto;
        max-height: 250px;
        padding: 10px;
        gap: 8px;
        border-right: none;
        border-bottom: 1px solid rgba(255,255,255,.08);
    }

    .historico {
        max-height: 100px;
    }

    .main {
        height: calc(100vh - 250px);
    }

    .chat {
        padding: 13px;
    }

    .msg-user,
    .msg-bot {
        max-width: 91%;
    }

    .opcoes {
        padding: 8px 10px;
        gap: 10px;
    }

    .seletor-voz {
        width: 100%;
    }

    .seletor-voz select {
        flex: 1;
        max-width: none;
    }

    .entrada {
        padding: 9px;
        gap: 7px;
    }

    .entrada input[type="text"] {
        padding: 12px;
    }

    .entrada button#btnEnviar {
        padding: 12px 15px;
    }

    .btn-arquivo {
        width: 43px;
        padding: 12px 0;
    }

    .botao-perfil {
        right: 10px;
        width: 38px;
        height: 38px;
        font-size: 19px;
    }

}

</style>

</head>

<body>

<aside class="sidebar">

<div class="logo">
    <h2>🤖 Orion AI</h2>
</div>

<div class="usuario">
    Olá, {{ username }}
</div>

<div class="plano">

    {% if plan == "premium" %}
        ⭐ Plano PREMIUM
    {% else %}
        🆓 Plano FREE
    {% endif %}

</div>

<button
    class="nova-conversa"
    type="button"
    id="btnNovaConversa"
>
    🆕 Nova conversa
</button>

<div class="historico-titulo">
    🗂️ Suas conversas
</div>

<div
    id="historicoConversas"
    class="historico"
>

    <div class="historico-vazio">
        Carregando conversas...
    </div>

</div>

<a
    href="/logout"
    class="logout"
>
    🚪 Sair
</a>

</aside>

<main class="main">

<header class="header">

<span id="tituloConversa">
    Orion AI
</span>

<a
    href="/perfil"
    class="botao-perfil"
    title="Meu perfil"
    aria-label="Meu perfil"
>
    ⚙️
</a>

</header>

<div class="opcoes">

<label>

    <input
        type="checkbox"
        id="voz"
        checked
    >

    🔊 Ouvir respostas

</label>

<div class="seletor-voz">

    <span>🎙️ Voz:</span>

    <select id="seletorVoz">

        <option value="default">
            Voz padrão do navegador
        </option>

    </select>

    <button
        type="button"
        id="btnTestarVoz"
        class="btn-testar-voz"
    >
        ▶️ Testar
    </button>

</div>

</div>

<div class="chat-area">

<div
    id="chat"
    class="chat"
></div>

<div
    id="welcome"
    class="welcome"
>

    <h2>🤖 Orion AI</h2>

    <p>Como posso ajudar hoje?</p>

    <div class="quick-actions">

        <button
            type="button"
            class="quick"
            data-texto="Criar código"
        >
            💻 Criar código
        </button>

        <button
            type="button"
            class="quick"
            data-texto="Estudar"
        >
            📚 Estudar
        </button>

        <button
            type="button"
            class="quick"
            data-texto="Fazer resumo"
        >
            📝 Fazer resumo
        </button>

        <button
            type="button"
            class="quick"
            data-texto="Tirar dúvidas"
        >
            ❓ Tirar dúvidas
        </button>

    </div>

</div>

</div>

<div
    id="arquivoSelecionado"
    class="arquivo-selecionado"
>

<span>📎</span>

<span
    id="nomeArquivo"
    class="nome-arquivo"
>
    Nenhum arquivo selecionado
</span>

<button
    type="button"
    id="removerArquivo"
    class="remover-arquivo"
>
    ✕
</button>

</div>

<div class="entrada">

<input
    type="file"
    id="arquivo"
    accept="image/*"
    hidden
>

<button
    type="button"
    id="btnArquivo"
    class="btn-arquivo"
>
    📎
</button>

<input
    type="text"
    id="mensagem"
    placeholder="Digite sua mensagem..."
    autocomplete="off"
    spellcheck="true"
>

<button
    id="btnEnviar"
    type="button"
>
    Enviar
</button>

</div>

</main>

<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
