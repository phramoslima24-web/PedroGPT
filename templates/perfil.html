
<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Perfil - Orion AI</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;

    display: flex;

    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            circle at top,
            #111827,
            #0b0f19 60%,
            #05070d
        );

    color: white;

    padding: 20px;
}

.perfil-container {
    width: 100%;
    max-width: 520px;
}

.perfil-card {

    background:
        rgba(255,255,255,.05);

    border:
        1px solid
        rgba(255,255,255,.09);

    backdrop-filter:
        blur(18px);

    border-radius:
        24px;

    padding:
        30px;

    box-shadow:
        0 20px 60px
        rgba(0,0,0,.35);
}

.topo {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 30px;
}

.voltar {

    text-decoration: none;

    color:
        rgba(255,255,255,.7);

    font-size: 14px;

    padding: 8px 12px;

    border-radius: 10px;

    background:
        rgba(255,255,255,.06);

    transition: .2s;
}

.voltar:hover {

    color: white;

    background:
        rgba(255,255,255,.1);
}

.titulo {

    font-size: 20px;

    font-weight: bold;
}

.avatar {

    width: 90px;
    height: 90px;

    margin: 0 auto 16px;

    border-radius: 50%;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 38px;

    background:
        linear-gradient(
            135deg,
            #7c3aed,
            #4f46e5
        );

    box-shadow:
        0 12px 30px
        rgba(79,70,229,.35);
}

.usuario {

    text-align: center;

    font-size: 22px;

    font-weight: bold;

    margin-bottom: 12px;
}

.plano {

    width: fit-content;

    margin: 0 auto 28px;

    padding: 8px 14px;

    border-radius: 999px;

    font-size: 12px;

    font-weight: bold;

    background:
        rgba(124,58,237,.15);

    border:
        1px solid
        rgba(124,58,237,.25);

    color:
        #c4b5fd;
}

.estatisticas {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 12px;

    margin-bottom: 22px;
}

.stat {

    padding: 18px;

    border-radius: 15px;

    background:
        rgba(255,255,255,.04);

    border:
        1px solid
        rgba(255,255,255,.07);

    text-align: center;
}

.stat-valor {

    font-size: 25px;

    font-weight: bold;

    margin-bottom: 5px;
}

.stat-label {

    font-size: 12px;

    color:
        rgba(255,255,255,.5);
}

.info {

    padding: 16px;

    border-radius: 14px;

    background:
        rgba(255,255,255,.04);

    border:
        1px solid
        rgba(255,255,255,.07);

    margin-bottom: 18px;
}

.info-titulo {

    font-size: 12px;

    color:
        rgba(255,255,255,.45);

    margin-bottom: 5px;
}

.info-valor {

    font-size: 14px;
}

.acoes {

    display: flex;

    flex-direction: column;

    gap: 10px;
}

.botao {

    width: 100%;

    border: none;

    padding: 13px;

    border-radius: 12px;

    color: white;

    cursor: pointer;

    font-weight: bold;

    background:
        rgba(255,255,255,.07);

    border:
        1px solid
        rgba(255,255,255,.08);
}

.botao:hover {

    background:
        rgba(255,255,255,.11);
}

.botao-sair {

    background:
        rgba(239,68,68,.12);

    border-color:
        rgba(239,68,68,.2);

    color:
        #fca5a5;
}

.botao-sair:hover {

    background:
        rgba(239,68,68,.2);
}


/* ============================================================
   MODAL ALTERAR SENHA
============================================================ */

.modal {

    position: fixed;

    inset: 0;

    display: none;

    align-items: center;

    justify-content: center;

    padding: 20px;

    background:
        rgba(0,0,0,.65);

    backdrop-filter:
        blur(8px);

    z-index: 9999;
}

.modal.ativo {

    display: flex;
}

.modal-card {

    width: 100%;

    max-width: 420px;

    background:
        rgba(17,24,39,.96);

    border:
        1px solid
        rgba(255,255,255,.10);

    border-radius: 20px;

    padding: 24px;

    box-shadow:
        0 25px 80px
        rgba(0,0,0,.45);
}

.modal-topo {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 20px;
}

.modal-titulo {

    font-size: 19px;

    font-weight: bold;
}

.fechar-modal {

    width: 34px;

    height: 34px;

    border: none;

    border-radius: 9px;

    background:
        rgba(255,255,255,.06);

    color: white;

    cursor: pointer;

    font-size: 18px;
}

.fechar-modal:hover {

    background:
        rgba(255,255,255,.11);
}


/* ============================================================
   CAMPOS
============================================================ */

.campo {

    margin-bottom: 14px;
}

.campo label {

    display: block;

    font-size: 12px;

    color:
        rgba(255,255,255,.55);

    margin-bottom: 6px;
}

.senha-box {

    position: relative;

    width: 100%;
}

.senha-box input {

    width: 100%;

    padding:
        12px 48px 12px 13px;

    border-radius: 11px;

    border:
        1px solid
        rgba(255,255,255,.10);

    background:
        rgba(255,255,255,.06);

    color: white;

    outline: none;

    transition: .2s;
}

.senha-box input:focus {

    border-color:
        #7c3aed;

    box-shadow:
        0 0 0 3px
        rgba(124,58,237,.10);
}

.senha-box input::placeholder {

    color:
        rgba(255,255,255,.3);
}

.olho-senha {

    position: absolute;

    right: 10px;

    top: 50%;

    transform:
        translateY(-50%);

    width: 32px;

    height: 32px;

    display: flex;

    align-items: center;

    justify-content: center;

    border: none;

    border-radius: 8px;

    background:
        transparent;

    color: white;

    cursor: pointer;

    font-size: 17px;

    opacity: .7;

    transition: .15s;
}

.olho-senha:hover {

    opacity: 1;

    background:
        rgba(255,255,255,.07);

    transform:
        translateY(-50%)
        scale(1.05);
}

.mensagem {

    display: none;

    margin-bottom: 14px;

    padding: 11px 12px;

    border-radius: 10px;

    font-size: 13px;
}

.mensagem.ativa {

    display: block;
}

.mensagem.erro {

    background:
        rgba(239,68,68,.12);

    border:
        1px solid
        rgba(239,68,68,.20);

    color:
        #fca5a5;
}

.mensagem.sucesso {

    background:
        rgba(16,185,129,.12);

    border:
        1px solid
        rgba(16,185,129,.20);

    color:
        #6ee7b7;
}

.btn-salvar-senha {

    width: 100%;

    padding: 13px;

    border: none;

    border-radius: 11px;

    background:
        linear-gradient(
            135deg,
            #7c3aed,
            #4f46e5
        );

    color: white;

    font-weight: bold;

    cursor: pointer;

    transition: .18s;
}

.btn-salvar-senha:hover {

    filter: brightness(1.08);

    transform:
        translateY(-1px);
}

.btn-salvar-senha:disabled {

    opacity: .55;

    cursor: not-allowed;

    transform: none;
}

@media(max-width:600px) {

    .perfil-card {
        padding: 22px;
    }

    .estatisticas {
        grid-template-columns:
            1fr 1fr;
    }

    .modal-card {
        padding: 20px;
    }

}

</style>

</head>

<body>

<div class="perfil-container">

<div class="perfil-card">

    <div class="topo">

        <a
            href="/"
            class="voltar"
        >
            ← Voltar
        </a>

        <div class="titulo">
            Meu perfil
        </div>

    </div>


    <div class="avatar">
        👤
    </div>


    <div class="usuario">
        {{ username }}
    </div>


    <div class="plano">

        {% if plan == "premium" %}

            ⭐ Plano PREMIUM

        {% else %}

            🆓 Plano FREE

        {% endif %}

    </div>


    <div class="estatisticas">

        <div class="stat">

            <div
                class="stat-valor"
                id="totalConversas"
            >
                {{ total_conversas or 0 }}
            </div>

            <div class="stat-label">
                💬 Conversas
            </div>

        </div>


        <div class="stat">

            <div
                class="stat-valor"
                id="totalMensagens"
            >
                {{ total_mensagens or 0 }}
            </div>

            <div class="stat-label">
                📝 Mensagens
            </div>

        </div>

    </div>


    <div class="info">

        <div class="info-titulo">
            👤 Usuário
        </div>

        <div class="info-valor">
            {{ username }}
        </div>

    </div>


    <div class="acoes">

        <button
            type="button"
            class="botao"
            id="btnAlterarSenha"
        >
            🔑 Alterar senha
        </button>


        <a
            href="/logout"
            class="botao botao-sair"
            style="
                text-align:center;
                text-decoration:none;
            "
        >
            🚪 Sair da conta
        </a>

    </div>

</div>

</div>


<!-- =========================================================
     MODAL ALTERAR SENHA
========================================================= -->

<div
    id="modalSenha"
    class="modal"
>

    <div class="modal-card">

        <div class="modal-topo">

            <div class="modal-titulo">
                🔑 Alterar senha
            </div>

            <button
                type="button"
                class="fechar-modal"
                id="fecharModal"
                aria-label="Fechar"
            >
                ✕
            </button>

        </div>


        <div
            id="mensagemSenha"
            class="mensagem"
        ></div>


        <!-- SENHA ATUAL -->

        <div class="campo">

            <label for="senhaAtual">
                Senha atual
            </label>

            <div class="senha-box">

                <input
                    type="password"
                    id="senhaAtual"
                    autocomplete="current-password"
                    placeholder="Digite sua senha atual"
                >

                <button
                    type="button"
                    class="olho-senha"
                    id="olhoSenhaAtual"
                    onclick="alternarSenha(
                        'senhaAtual',
                        'olhoSenhaAtual'
                    )"
                    aria-label="Mostrar senha atual"
                >
                    👁️
                </button>

            </div>

        </div>


        <!-- NOVA SENHA -->

        <div class="campo">

            <label for="novaSenha">
                Nova senha
            </label>

            <div class="senha-box">

                <input
                    type="password"
                    id="novaSenha"
                    autocomplete="new-password"
                    placeholder="Digite a nova senha"
                >

                <button
                    type="button"
                    class="olho-senha"
                    id="olhoNovaSenha"
                    onclick="alternarSenha(
                        'novaSenha',
                        'olhoNovaSenha'
                    )"
                    aria-label="Mostrar nova senha"
                >
                    👁️
                </button>

            </div>

        </div>


        <!-- CONFIRMAR SENHA -->

        <div class="campo">

            <label for="confirmarSenha">
                Confirmar nova senha
            </label>

            <div class="senha-box">

                <input
                    type="password"
                    id="confirmarSenha"
                    autocomplete="new-password"
                    placeholder="Digite novamente a nova senha"
                >

                <button
                    type="button"
                    class="olho-senha"
                    id="olhoConfirmarSenha"
                    onclick="alternarSenha(
                        'confirmarSenha',
                        'olhoConfirmarSenha'
                    )"
                    aria-label="Mostrar confirmação"
                >
                    👁️
                </button>

            </div>

        </div>


        <button
            type="button"
            class="btn-salvar-senha"
            id="btnSalvarSenha"
        >
            Alterar senha
        </button>

    </div>

</div>


<script>

/* ============================================================
   ELEMENTOS
============================================================ */

const btnAlterarSenha =
    document.getElementById(
        "btnAlterarSenha"
    );

const modalSenha =
    document.getElementById(
        "modalSenha"
    );

const fecharModal =
    document.getElementById(
        "fecharModal"
    );

const btnSalvarSenha =
    document.getElementById(
        "btnSalvarSenha"
    );

const mensagemSenha =
    document.getElementById(
        "mensagemSenha"
    );

const senhaAtual =
    document.getElementById(
        "senhaAtual"
    );

const novaSenha =
    document.getElementById(
        "novaSenha"
    );

const confirmarSenha =
    document.getElementById(
        "confirmarSenha"
    );


/* ============================================================
   OLHO DAS SENHAS
============================================================ */

function alternarSenha(
    idCampo,
    idBotao
) {

    const campo =
        document.getElementById(
            idCampo
        );

    const botao =
        document.getElementById(
            idBotao
        );

    if (!campo || !botao) {
        return;
    }

    if (
        campo.type === "password"
    ) {

        campo.type =
            "text";

        botao.textContent =
            "🙈";

        botao.setAttribute(
            "aria-label",
            "Esconder senha"
        );

    } else {

        campo.type =
            "password";

        botao.textContent =
            "👁️";

        botao.setAttribute(
            "aria-label",
            "Mostrar senha"
        );

    }

}


/* ============================================================
   MENSAGEM
============================================================ */

function mostrarMensagem(
    texto,
    tipo
) {

    if (!mensagemSenha) {
        return;
    }

    mensagemSenha.textContent =
        texto;

    mensagemSenha.className =
        "mensagem ativa " + tipo;
}


function limparMensagem() {

    if (!mensagemSenha) {
        return;
    }

    mensagemSenha.textContent =
        "";

    mensagemSenha.className =
        "mensagem";
}


/* ============================================================
   ABRIR MODAL
============================================================ */

function abrirModalSenha() {

    limparMensagem();

    senhaAtual.value = "";
    novaSenha.value = "";
    confirmarSenha.value = "";

    /* Sempre começar escondido */

    senhaAtual.type =
        "password";

    novaSenha.type =
        "password";

    confirmarSenha.type =
        "password";

    document.getElementById(
        "olhoSenhaAtual"
    ).textContent =
        "👁️";

    document.getElementById(
        "olhoNovaSenha"
    ).textContent =
        "👁️";

    document.getElementById(
        "olhoConfirmarSenha"
    ).textContent =
        "👁️";

    modalSenha.classList.add(
        "ativo"
    );

    setTimeout(
        function () {

            senhaAtual.focus();

        },
        100
    );
}


/* ============================================================
   FECHAR MODAL
============================================================ */

function fecharModalSenha() {

    modalSenha.classList.remove(
        "ativo"
    );

}


/* ============================================================
   BOTÃO ALTERAR SENHA
============================================================ */

btnAlterarSenha.addEventListener(
    "click",
    abrirModalSenha
);


/* ============================================================
   BOTÃO FECHAR
============================================================ */

fecharModal.addEventListener(
    "click",
    fecharModalSenha
);


/* ============================================================
   CLICAR FORA
============================================================ */

modalSenha.addEventListener(
    "click",
    function (event) {

        if (
            event.target ===
            modalSenha
        ) {

            fecharModalSenha();

        }

    }
);


/* ============================================================
   ESC
============================================================ */

document.addEventListener(
    "keydown",
    function (event) {

        if (
            event.key === "Escape"
        ) {

            if (
                modalSenha.classList.contains(
                    "ativo"
                )
            ) {

                fecharModalSenha();

            }

        }

    }
);


/* ============================================================
   SALVAR SENHA
============================================================ */

btnSalvarSenha.addEventListener(
    "click",
    async function () {

        const atual =
            senhaAtual.value;

        const nova =
            novaSenha.value;

        const confirmacao =
            confirmarSenha.value;


        limparMensagem();


        /* CAMPOS */

        if (
            !atual ||
            !nova ||
            !confirmacao
        ) {

            mostrarMensagem(
                "Preencha todos os campos.",
                "erro"
            );

            return;

        }


        /* TAMANHO */

        if (
            nova.length < 6
        ) {

            mostrarMensagem(
                "A nova senha precisa ter pelo menos 6 caracteres.",
                "erro"
            );

            return;

        }


        /* NÚMERO */

        if (
            !/\d/.test(nova)
        ) {

            mostrarMensagem(
                "A nova senha precisa ter pelo menos 1 número.",
                "erro"
            );

            return;

        }


        /* CONFIRMAÇÃO */

        if (
            nova !== confirmacao
        ) {

            mostrarMensagem(
                "A confirmação da senha não confere.",
                "erro"
            );

            return;

        }


        /* MESMA SENHA */

        if (
            atual === nova
        ) {

            mostrarMensagem(
                "A nova senha precisa ser diferente da senha atual.",
                "erro"
            );

            return;

        }


        btnSalvarSenha.disabled =
            true;

        btnSalvarSenha.textContent =
            "⏳ Salvando...";


        try {

            const resposta =
                await fetch(
                    "/api/change-password",
                    {
                        method: "POST",

                        credentials:
                            "same-origin",

                        headers: {

                            "Accept":
                                "application/json",

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify({

                                current_password:
                                    atual,

                                new_password:
                                    nova,

                                confirm_password:
                                    confirmacao

                            })

                    }
                );


            let dados = {};

            try {

                dados =
                    await resposta.json();

            } catch (
                erroJson
            ) {

                dados = {};

            }


            if (
                !resposta.ok ||
                dados.success === false
            ) {

                throw new Error(

                    dados.message ||
                    "Não foi possível alterar a senha."

                );

            }


            mostrarMensagem(
                "✅ Senha alterada com sucesso!",
                "sucesso"
            );


            senhaAtual.value = "";
            novaSenha.value = "";
            confirmarSenha.value = "";


            setTimeout(
                fecharModalSenha,
                1500
            );


        } catch (erro) {

            console.error(
                "ERRO AO ALTERAR SENHA:",
                erro
            );

            mostrarMensagem(
                "❌ " +
                erro.message,
                "erro"
            );

        } finally {

            btnSalvarSenha.disabled =
                false;

            btnSalvarSenha.textContent =
                "Alterar senha";

        }

    }
);

</script>

</body>

</html>
