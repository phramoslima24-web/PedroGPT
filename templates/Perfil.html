<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Perfil - Orion AI</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            circle at top,
            #111827,
            #0b0f19 60%,
            #05070d
        );

    color: white;
    padding: 20px;
}

.perfil-container {
    width: 100%;
    max-width: 520px;
}

.perfil-card {

    background: rgba(255,255,255,.05);

    border: 1px solid rgba(255,255,255,.09);

    backdrop-filter: blur(18px);

    border-radius: 24px;

    padding: 30px;

    box-shadow:
        0 20px 60px rgba(0,0,0,.35);
}

.topo {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 30px;
}

.voltar {

    text-decoration: none;

    color: rgba(255,255,255,.7);

    font-size: 14px;

    padding: 8px 12px;

    border-radius: 10px;

    background: rgba(255,255,255,.06);

    transition: .2s;
}

.voltar:hover {

    color: white;

    background: rgba(255,255,255,.1);
}

.titulo {

    font-size: 20px;

    font-weight: bold;
}

.avatar {

    width: 90px;
    height: 90px;

    margin: 0 auto 16px;

    border-radius: 50%;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 38px;

    background:
        linear-gradient(
            135deg,
            #7c3aed,
            #4f46e5
        );

    box-shadow:
        0 12px 30px rgba(79,70,229,.35);
}

.usuario {

    text-align: center;

    font-size: 22px;

    font-weight: bold;

    margin-bottom: 12px;
}

.plano {

    width: fit-content;

    margin: 0 auto 28px;

    padding: 8px 14px;

    border-radius: 999px;

    font-size: 12px;

    font-weight: bold;

    background: rgba(124,58,237,.15);

    border: 1px solid rgba(124,58,237,.25);

    color: #c4b5fd;
}

.estatisticas {

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 12px;

    margin-bottom: 22px;
}

.stat {

    padding: 18px;

    border-radius: 15px;

    background: rgba(255,255,255,.04);

    border: 1px solid rgba(255,255,255,.07);

    text-align: center;
}

.stat-valor {

    font-size: 25px;

    font-weight: bold;

    margin-bottom: 5px;
}

.stat-label {

    font-size: 12px;

    color: rgba(255,255,255,.5);
}

.info {

    padding: 16px;

    border-radius: 14px;

    background: rgba(255,255,255,.04);

    border: 1px solid rgba(255,255,255,.07);

    margin-bottom: 18px;
}

.info-titulo {

    font-size: 12px;

    color: rgba(255,255,255,.45);

    margin-bottom: 5px;
}

.info-valor {

    font-size: 14px;
}

.acoes {

    display: flex;

    flex-direction: column;

    gap: 10px;
}

.botao {

    width: 100%;

    border: none;

    padding: 13px;

    border-radius: 12px;

    color: white;

    cursor: pointer;

    font-weight: bold;

    background: rgba(255,255,255,.07);

    border: 1px solid rgba(255,255,255,.08);
}

.botao:hover {

    background: rgba(255,255,255,.11);
}

.botao-sair {

    background: rgba(239,68,68,.12);

    border-color: rgba(239,68,68,.2);

    color: #fca5a5;
}

.botao-sair:hover {

    background: rgba(239,68,68,.2);
}

@media(max-width:600px) {

    .perfil-card {
        padding: 22px;
    }

    .estatisticas {
        grid-template-columns: 1fr 1fr;
    }

}

</style>

</head>

<body>

<div class="perfil-container">

```
<div class="perfil-card">

    <div class="topo">

        <a
            href="/"
            class="voltar"
        >
            ← Voltar
        </a>

        <div class="titulo">
            Meu perfil
        </div>

    </div>

    <div class="avatar">
        👤
    </div>

    <div class="usuario">
        {{ username }}
    </div>

    <div class="plano">

        {% if plan == "premium" %}
            ⭐ Plano PREMIUM
        {% else %}
            🆓 Plano FREE
        {% endif %}

    </div>

    <div class="estatisticas">

        <div class="stat">

            <div
                class="stat-valor"
                id="totalConversas"
            >
                0
            </div>

            <div class="stat-label">
                💬 Conversas
            </div>

        </div>

        <div class="stat">

            <div
                class="stat-valor"
                id="totalMensagens"
            >
                0
            </div>

            <div class="stat-label">
                📝 Mensagens
            </div>

        </div>

    </div>

    <div class="info">

        <div class="info-titulo">
            👤 Usuário
        </div>

        <div class="info-valor">
            {{ username }}
        </div>

    </div>

    <div class="acoes">

        <button
            type="button"
            class="botao"
        >
            🔑 Alterar senha
        </button>

        <a
            href="/logout"
            class="botao botao-sair"
            style="text-align:center;text-decoration:none;"
        >
            🚪 Sair da conta
        </a>

    </div>

</div>
```

</div>

</body>

</html>
